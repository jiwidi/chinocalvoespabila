<!doctype html>
<html lang="en">

<title>Supreme Forever · Raid planner</title>
<meta name="description" content="Supreme Forever: shared, live raid planner for World of Warcraft: Forever.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<!-- Vercel Web Analytics (visitors and page views). Vercel serves this script when Analytics is enabled for the project. -->

<style>
:root{
  /* Dark, quiet UI in the spirit of Wowhead: near-black surfaces, thin borders, gold accent, class colors carry the meaning. */
  --bg:#0e0e10;
  --panel:#161618;
  --panel-2:#1d1d20;
  --slot:#121214;
  --line:#2a2a2e;
  --line-2:#3a3a40;
  --accent:#f2b84b;
  --accent-ink:#1a1206;
  --text:#e8e8ea;
  --soft:#c4c4c9;
  --muted:#8d8d95;
  --faint:#6c6c74;
  --warn:#f2b84b;
  --bad:#e5564b;
  --ok:#4cc46b;
  --radius:8px;
  /* Roles and primary stats, used by the composition card and the preference chips */
  --tank:#5aa0ff;
  --heal:#4cc46b;
  --melee:#ef6a5a;
  --range:#c08cff;
  --int:#62b3ff;
  --agi:#f2c94c;
  --str:#ef6a5a;
  --font:"Open Sans",Arial,"Helvetica Neue",Helvetica,sans-serif;
  --narrow:"Open Sans",Arial,sans-serif;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Section titles: small uppercase labels, like Wowhead's navigation */
.ttl{display:flex;align-items:baseline;gap:8px;margin:0;font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#fff}
.ttl small{font-family:var(--font);font-size:11.5px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted)}
.ttl .count{font-family:var(--font);font-size:11px;font-weight:700;letter-spacing:0;padding:1px 7px;border-radius:10px;background:var(--panel-2);color:var(--soft)}

/* Top bar */
.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));background:rgba(14,14,16,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:30px;border-radius:6px;background:linear-gradient(135deg,#f2b84b,#b8741f);display:grid;place-items:center;color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:17px}
.brand h1 span{color:var(--accent)}
.brand h1{margin:0;font-family:var(--display);font-size:22px;line-height:1;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff}
.brand p{margin:2px 0 0;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
/* Launch calendar: past steps dim, the next one gold with a countdown */
.launch{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 auto 0 0;padding:0;list-style:none}
.launch li{display:flex;flex-direction:column;justify-content:center;min-height:36px;padding:3px 11px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel-2);line-height:1.2}
.launch li b{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.launch li span{font-size:12px;font-weight:700;color:var(--soft);white-space:nowrap}
.launch li small{font-size:10.5px;font-weight:600;color:var(--muted)}
.launch li.past{opacity:.5}
.launch li.next{border-color:var(--accent);background:rgba(242,184,75,.1);box-shadow:0 0 18px rgba(242,184,75,.15)}
.launch li.next b,.launch li.next small{color:var(--accent)}
.launch li.next span{color:#fff}
@media (max-width:700px){.launch{order:3;width:100%}.launch li{flex:1 1 30%}}
.btn{height:32px;padding:0 14px;border:1px solid var(--line-2);border-radius:6px;background:var(--panel-2);font-weight:600;font-size:12px;white-space:nowrap;color:var(--soft);transition:border-color .12s,color .12s,background .12s}
.btn:hover{border-color:var(--muted);color:#fff}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#ffc65e;color:var(--accent-ink)}
.btn.armed{border-color:var(--bad);background:#2a1513;color:#ffb4ab}
.btn.admin{border-color:var(--warn);color:var(--warn)}
.btn.discord{background:#5865f2;border-color:#5865f2;color:#fff}
.btn.discord:hover{background:#4752c4;border-color:#4752c4;color:#fff}
.btn.sm{height:24px;padding:0 9px;font-size:11.5px}
/* Audit view (admin): every signup with its Discord claim, and the changelog, in place of the roster */
.audit{display:grid;gap:16px;align-items:start;max-width:1520px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
.audit .phead{margin-bottom:6px}
.ck-acts{display:flex;gap:6px}
.ck-none{font-size:11.5px;font-style:italic;color:var(--faint)}
.au-stats{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.au-table .c-specs{width:150px}.au-table .c-status{width:96px}.au-table .c-when{width:96px}.au-table .c-dc{width:150px}.au-table .c-act{width:92px}
.au-table td:last-child{text-align:right}
.au-table .c-act2{width:150px}.au-table .c-dc2{width:240px}
.au-asks{border-color:var(--accent)}
.tab-badge{display:inline-grid;place-items:center;min-width:16px;height:16px;margin-left:4px;padding:0 4px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-size:10.5px}
/* Claim picker and the claim line in the signups panel */
.ask-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:min(55vh,460px);overflow-y:auto}
.ask-pick{display:flex;align-items:center;gap:8px;min-width:0;height:36px;padding:0 10px;border:1px solid var(--line-2);border-radius:6px;background:var(--panel-2);font-weight:700;font-size:13px;color:#fff;text-align:left}
.ask-pick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ask-pick:hover,.ask-pick:focus-visible{border-color:var(--accent)}
.ask-pick.on{border-color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.ck-fx{flex:none;width:22px;height:22px;border-radius:50%}
.ask-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-4px 0 12px;padding:8px 10px;border:1px dashed var(--line-2);border-radius:6px;font-size:12.5px;color:var(--soft)}
.seg{display:inline-flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--line-2);border-radius:6px;background:var(--panel-2);height:32px}
.seg span{padding:0 6px 0 8px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg button{height:26px;padding:0 10px;border:0;border-radius:4px;background:none;font-weight:700;font-size:12px;color:var(--muted)}
.seg button:hover{color:#fff}
.seg button[aria-pressed="true"]{background:var(--line-2);color:#fff}
.live{display:inline-flex;align-items:center;gap:6px;min-width:110px;padding:0 6px;font-size:12px;font-weight:600;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.live.ok i{background:var(--ok);box-shadow:0 0 0 3px rgba(76,196,107,.18)}
.live.busy i{background:var(--accent)}
.live.bad i{background:var(--bad)}

/* Layout: signups take the left column; groups, suggestion, preferences and coverage stack on the right. */
.layout{display:grid;grid-template-columns:460px minmax(0,1fr);gap:16px;align-items:start;max-width:1520px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
.plan,.side{display:grid;gap:16px;min-width:0}
@media (max-width:960px){.layout{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);min-width:0;padding:14px 16px 16px}
.phead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin:0 0 12px}
.banner{grid-column:1 / -1;padding:10px 14px;border:1px solid rgba(242,184,75,.5);background:#211a0c;color:#f6dca4;border-radius:var(--radius);font-size:12.5px}

.hint{margin:4px 0 12px;font-size:12px;color:var(--muted)}
/* Composition: role tiles, armor and token bars */
.comp{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:18px}
.ccard{padding:10px 12px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2)}
.ccard h4{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ccard h4 small{font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--soft)}
.roles{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.role{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;padding:7px 8px;border-radius:5px;background:var(--slot);box-shadow:inset 3px 0 0 var(--rc)}
.role .ic{grid-row:1 / 3;width:28px;height:28px}
.role b{font-size:18px;line-height:1;color:var(--rc);font-variant-numeric:tabular-nums}
.role span{font-size:11px;font-weight:600;color:var(--soft)}
.role.zero{opacity:.45}
.role.zero .ic{filter:grayscale(1)}
.r-tank{--rc:var(--tank)}.r-heal{--rc:var(--heal)}.r-melee{--rc:var(--melee)}.r-range{--rc:var(--range)}
.meter{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.meter + .meter{border-top:1px solid var(--line)}
.meter > .ic{width:26px;height:26px;margin-top:1px}
.meter.zero{opacity:.45}
.meter.zero .ic{filter:grayscale(1)}
.m-body{flex:1;min-width:0}
.m-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:600;color:var(--soft)}
.m-top b{font-size:13px;color:#fff;font-variant-numeric:tabular-nums}
.bar{display:flex;gap:2px;height:6px;margin:5px 0 5px;border-radius:3px;background:var(--slot);overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px}
.m-legend{display:flex;flex-wrap:wrap;gap:2px 10px}
.st{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.st i{width:7px;height:7px;border-radius:2px;background:var(--sc)}
.s-int{--sc:var(--int)}.s-agi{--sc:var(--agi)}.s-str{--sc:var(--str)}

/* Icons */
.ic{display:block;flex:none;background:var(--panel-2);border-radius:4px;object-fit:cover}
.ic.broken{opacity:0}

/* Groups: each group is a card, each slot a dark row tinted with the class color */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.group{padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2)}
.group h3{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 8px;font-family:var(--display);font-size:13.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.group h3 span{font-family:var(--font);font-size:11px;font-weight:600;letter-spacing:0;color:var(--muted)}
.cells{display:flex;flex-direction:column;gap:4px}
.cell{position:relative;display:flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 4px;border:1px solid transparent;border-radius:5px;background:var(--slot);cursor:pointer;transition:border-color .12s,opacity .12s,background .12s}
.cell.empty{border:1px dashed #45454c;background:rgba(255,255,255,.02)}
.cell.empty::after{content:"+";margin:auto;font-size:15px;font-weight:600;color:var(--faint);transition:color .12s}
.cell.empty:hover{border-color:var(--muted)}
.cell.empty:hover::after{content:"+ Add player";font-size:11.5px;color:var(--soft)}
.cell.empty.sel::after{content:none}
.cell.sel{border-color:var(--accent)!important;box-shadow:0 0 0 1px var(--accent)}
.cell.filled{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 20%,var(--slot)) 0%,var(--slot) 75%);box-shadow:inset 3px 0 0 var(--c)}
.cell.filled:hover{border-color:var(--line-2)}
.cell.filled .ic{width:28px;height:28px;margin-left:3px}
.cell .nm{flex:1;min-width:0;font-weight:700;font-size:13px;color:var(--cn,var(--c));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .nm.anon{font-weight:400;font-style:italic;color:var(--muted)}
.cell input{flex:1;min-width:0;height:26px;margin-right:22px;padding:0 8px;border:1px solid var(--line-2);border-radius:4px;background:#000;color:#fff;font-weight:700;font-size:13px}
.cell .x{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:22px;height:22px;padding:0;border:0;border-radius:4px;background:var(--panel-2);color:var(--soft);font-weight:700;font-size:13px;line-height:22px;opacity:0}
.cell .x:hover{background:var(--bad);color:#fff}
.cell:hover .x,.cell.editing .x,.cell:focus-within .x{opacity:1}
@media (hover:none){.cell .x{opacity:.9}}
.cell .pick{flex:1;min-width:0;height:28px;padding:0 6px;border:0;border-radius:4px;background:var(--panel-2);color:var(--text);font-weight:600;font-size:12px;cursor:pointer}
.cell .pick option,.cell .pick optgroup{background:var(--panel);color:var(--text)}
.cell.drop{outline:2px dashed var(--accent);outline-offset:1px}
.cell.dragging{opacity:.35}
.grid.filtering .cell.filled:not(.hl){opacity:.3}
.cell.hl{border-color:#fff}
/* A player's specs in preference order (best on the left), the one they are playing lit up. */
.prio{display:flex;flex:none;gap:3px}
.prio .pr{display:block;padding:0;border:0;border-radius:3px;background:none}
.prio .ic{width:18px;height:18px;border-radius:3px;opacity:.3;filter:grayscale(.6);transition:opacity .12s,filter .12s}
.prio .pr:hover .ic{opacity:.85;filter:none}
.prio .pr.cur .ic{opacity:1;filter:none;box-shadow:0 0 0 1px #fff}
.cell.filled:hover .prio,.cell.filled:focus-within .prio{margin-right:24px}
@media (hover:none){.cell.filled .prio{margin-right:24px}}
.party{display:flex;flex-wrap:wrap;gap:4px;min-height:18px;margin:8px 2px 0}
.party .ic{width:18px;height:18px}
.foot{margin:12px 2px 0;font-size:11.5px;color:var(--faint)}

/* Signups */
.su{position:relative;display:flex;align-items:center;gap:8px;min-height:40px;padding:4px 6px;border-radius:6px}
.su + .su{margin-top:2px}
.su:hover{background:var(--panel-2)}
.su.placed .su-name,.su.placed .su-specs{opacity:.55}
.su.placed:hover .su-name,.su.placed:hover .su-specs,.su.placed:focus-within .su-name,.su.placed:focus-within .su-specs{opacity:1}
.su-name{flex:0 0 128px;width:128px;text-overflow:ellipsis;height:30px;padding:0 8px;border:1px solid transparent;border-radius:5px;background:none;font-weight:700;font-size:13px;color:#fff}
.su-name:hover{border-color:var(--line-2)}
.su-name:focus{border-color:var(--accent);background:#000}
.su-name[readonly],.su-name[readonly]:hover,.su-name[readonly]:focus{border-color:transparent;background:none;cursor:default}
.su.new{margin-bottom:8px;padding:8px;border:1px dashed var(--line-2);background:var(--slot)}
.su.new .su-name{background:#000;border-color:var(--line-2)}
.su-specs{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.chip{position:relative;display:inline-flex;border-radius:5px;box-shadow:0 0 0 2px var(--c);cursor:grab}
.chip button{display:block;padding:0;border:0;background:none;border-radius:5px}
.chip .ic{width:20px;height:20px}
.chip .x{position:absolute;top:-8px;right:-8px;width:15px;height:15px;border:0;border-radius:50%;background:var(--bad);color:#fff;font-size:10px;font-weight:700;line-height:15px;opacity:0}
.chip:hover .x,.chip .x:focus-visible{opacity:1}
.chip.on{box-shadow:0 0 0 2px var(--c),0 0 0 4px #fff}
.chip.dragging{opacity:.35}
/* Where a spec dragged along its own row will land */
.chip.ins-l::before,.chip.ins-r::before{content:"";position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--accent)}
.chip.ins-l::before{left:-6px}
.chip.ins-r::before{right:-6px}
.signups.filtering .chip:not(.elig){opacity:.2}
.signups.filtering .chip.elig{box-shadow:0 0 0 2px var(--c),0 0 0 4px #fff}
.su-add{appearance:none;width:26px;height:26px;padding:0;border:1px dashed var(--line-2);border-radius:5px;background:none;color:var(--muted);font-weight:700;font-size:15px;text-align:center;text-align-last:center;cursor:pointer}
.su-add:hover{border-color:var(--accent);color:var(--accent)}
.su-add option,.su-add optgroup{background:var(--panel);color:var(--text);font-size:12px;text-align:left}
.su .where{flex:none;padding:1px 7px;border-radius:10px;background:var(--panel-2);font-size:11px;font-weight:700;color:var(--soft)}
.su .mini{flex:none;width:24px;height:24px;padding:0;border:0;border-radius:4px;background:none;color:var(--faint);font-weight:700;font-size:14px;opacity:0}
.su:hover .mini,.su .mini:focus-visible{opacity:1}
.su .mini:hover{color:#fff;background:var(--bad)}
.su .mini.ok{color:var(--ok);opacity:1}
.su .st-bench{color:var(--warn);background:rgba(242,184,75,.14)}
.su .st-locked{color:var(--ok);background:rgba(76,196,107,.14)}
/* Admin actions: a small toolbar over the end of the row, shown on hover; it takes no room in the row. */
.su-tools{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:2px;padding:2px;border-radius:6px;background:var(--panel);box-shadow:0 0 0 1px var(--line-2),0 4px 12px rgba(0,0,0,.5);opacity:0;pointer-events:none}
.su:hover .su-tools,.su:focus-within .su-tools{opacity:1;pointer-events:auto}
.su-tools .tool{height:24px;padding:0 7px;border:0;border-radius:4px;background:none;font-family:inherit;font-size:11px;font-weight:700;color:var(--soft);cursor:pointer}
.su-tools .tool:hover{background:var(--line-2);color:#fff}
.su-tools .tool.t-lock.on{color:var(--ok)}
.su-tools .tool.t-bench.on{color:var(--warn)}
.su-tools .mini{opacity:1}
.su.pending .su-tools{position:static;transform:none;opacity:1;pointer-events:auto;box-shadow:none;background:none;margin-left:auto}
@media (hover:none){.su-tools{position:static;transform:none;opacity:1;pointer-events:auto;box-shadow:none;background:none}}
.sg-cell .lk{flex:none;padding:1px 6px;border-radius:9px;background:rgba(76,196,107,.14);color:var(--ok);font-size:10px;font-weight:700}
.su.benched .su-name,.su.benched .su-specs{opacity:.55}
.su .mini.ok:hover{background:var(--ok);color:var(--accent-ink)}
.su-wait{margin:0 0 10px;padding:6px 4px 4px;border:1px dashed var(--warn);border-radius:6px}
.su-wait .ttl{margin:0 0 4px 6px;font-size:12px;color:var(--warn)}
.su.pending .chip{cursor:default}
.su.pending .fx-btn,.su.pending .su-name,.su.pending .su-specs,.su.pending .where{filter:grayscale(1);opacity:.45}
@media (hover:none){.su .mini{opacity:1}}

/* Coverage */
.buffs-body{columns:220px;column-gap:28px}
.bsec{break-inside:avoid;padding-bottom:12px}
.bsec h4{margin:0 0 4px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bsec h4 small{font-weight:400;letter-spacing:0;text-transform:none;margin-left:4px}
.brow{display:flex;align-items:center;gap:8px;width:100%;padding:2px 6px;border:0;border-radius:4px;background:none;text-align:left;font-size:12px;color:var(--faint)}
.brow .ic{width:18px;height:18px;opacity:.35;filter:grayscale(1)}
.brow b{min-width:14px;text-align:right;font-variant-numeric:tabular-nums}
.brow.on{color:var(--soft)}
.brow.on b{color:var(--accent)}
.brow.on .ic{opacity:1;filter:none}
.brow:hover{background:var(--panel-2)}
.brow.pin{background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--accent)}
.notes{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:6px;break-inside:avoid}
.notes li{padding:8px 10px;border-radius:5px;border-left:3px solid var(--warn);background:#1f190d;font-size:12px;line-height:1.45;color:#f1dfb8}

/* Suggested comp */
.sg-sum{margin:0 0 10px;font-size:12px;color:var(--muted)}
.sg-sum b{color:#fff}
.needs{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 14px;padding:0;list-style:none}
.needs li{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px 0 3px;border-radius:13px;background:var(--panel-2);font-size:11.5px;font-weight:600;color:var(--soft)}
.needs li .ic{width:20px;height:20px;border-radius:50%}
.needs li.ok{box-shadow:inset 0 0 0 1px rgba(76,196,107,.45);color:#bfe8c9}
.needs li.miss{box-shadow:inset 0 0 0 1px rgba(229,86,75,.6);color:#ffb4ab}
.needs li.none{box-shadow:inset 0 0 0 1px var(--line-2);color:var(--muted)}
.needs li.bare{padding:0 3px;box-shadow:none;background:none}
.needs li.bare .ic{box-shadow:0 0 0 1px rgba(76,196,107,.5)}
.needs .sep{width:1px;height:18px;margin:0 4px;padding:0;background:var(--line-2);border-radius:0}
.sg-cell{display:flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 4px;border-radius:5px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 20%,var(--slot)) 0%,var(--slot) 75%);box-shadow:inset 3px 0 0 var(--c)}
.sg-cell .ic{width:28px;height:28px;margin-left:3px}
.sg-cell .nm{flex:1;min-width:0;font-weight:700;font-size:13px;color:var(--cn,var(--c));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg-cell.empty{background:rgba(255,255,255,.02);box-shadow:none;border:1px dashed #3a3a40}
.rk{flex:none;padding:1px 7px;border-radius:10px;background:var(--panel-2);font-size:10.5px;font-weight:700}
.rk.r1{color:var(--ok);background:rgba(76,196,107,.12)}
.rk.r2{color:var(--warn);background:rgba(242,184,75,.12)}
.rk.r3{color:#f08a4b;background:rgba(240,138,75,.12)}
.bench{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:14px 2px 0;padding:10px;border:1px dashed var(--line-2);border-radius:6px;font-size:12px;color:var(--muted)}
.bench-label{font-weight:700;color:var(--soft);margin-right:2px}
.bench-chip + .bench-label{margin-left:12px}
.bench-chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px 0 3px;border-radius:5px;background:var(--slot);box-shadow:inset 3px 0 0 var(--c,var(--line-2));font-weight:700;color:var(--cn,var(--soft))}
.bench-chip .ic{width:20px;height:20px}
/* Suggested comp: group header roles, party buffs, and who is off their 1st choice */
.suggest .grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.group h3 .gh{display:inline-flex;align-items:center;gap:4px}
.gr{padding:0 5px;border-radius:8px;font-style:normal;font-size:10px;font-weight:700;letter-spacing:0;line-height:16px}
.gr-tank{color:var(--tank);background:color-mix(in srgb,var(--tank) 14%,transparent)}
.gr-heal{color:var(--heal);background:color-mix(in srgb,var(--heal) 14%,transparent)}
.gr-dps{color:var(--melee);background:color-mix(in srgb,var(--melee) 14%,transparent)}
.moves{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2)}
.moves h4{margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.moves h4 small{margin-left:4px;padding:1px 7px;border-radius:10px;background:var(--slot);font-size:11px;letter-spacing:0;color:var(--soft)}
.moves ul{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px 14px;margin:0;padding:0;list-style:none}
.moves li{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:5px;background:var(--slot);box-shadow:inset 3px 0 0 var(--c)}
.mv-specs{display:flex;align-items:center;gap:4px;flex:none}
.mv-specs .ic{width:24px;height:24px}
.mv-specs .mv-from{opacity:.45;filter:grayscale(.6)}
.mv-arrow{color:var(--faint);font-weight:700}
.mv-txt{min-width:0;font-size:12px;color:var(--soft)}
.mv-txt b{color:var(--cn)}
.mv-txt .rk{margin-left:2px}
.mv-txt small{display:block;font-size:11px;color:var(--muted)}

/* Players left out: extra groups after the raid's, and the Bench panel */
.bench-group{border-style:dashed;background:transparent}
.bench-group h3{color:var(--muted)}
.sg-cell.benched{opacity:.7;background:var(--slot);box-shadow:inset 3px 0 0 var(--c,var(--line-2))}
.sg-cell.benched .ic{filter:grayscale(.5)}
.sg-cell .bt{flex:none;padding:1px 7px;border-radius:10px;background:var(--panel-2);font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.bench-body{display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px}
.bench-art{flex:0 0 auto;width:min(380px,100%);height:auto}
.bench-names{flex:1 1 260px;min-width:0}
.bench-names h4{margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bench-names h4 small{margin-left:4px;padding:1px 7px;border-radius:10px;background:var(--panel-2);font-size:11px;letter-spacing:0;color:var(--soft)}
.bench-names h4:not(:first-child){margin-top:14px}
.bench-list{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}

/* Comp options when more players signed up than the raid holds */
.sg-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.sg-tab{display:flex;flex-direction:column;align-items:flex-start;gap:1px;max-width:260px;padding:6px 12px;border:1px solid var(--line-2);border-radius:6px;background:var(--panel-2);text-align:left;color:var(--soft)}
.sg-tab b{font-size:12.5px;color:#fff}
.sg-tab small{max-width:100%;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg-tab:hover{border-color:var(--muted)}
.sg-tab.on{border-color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.sg-tab.on b{color:var(--accent)}
.sg-note{margin:0 0 10px;font-size:11.5px;color:var(--muted)}

/* Preferences */
/* Preferences: icon cards grouped by role, like raid sign-up bots */
.rtag{margin-left:2px;padding:1px 6px;border-radius:9px;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--rc);background:color-mix(in srgb,var(--rc) 14%,transparent)}
.rd{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rc)}
.pgroup + .pgroup{margin-top:20px}
.pgroup h4{display:flex;align-items:center;gap:7px;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid color-mix(in srgb,var(--rc) 30%,transparent);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--rc)}
.pgroup h4 small{padding:1px 7px;border-radius:10px;background:var(--panel-2);font-size:11px;letter-spacing:0;color:var(--soft)}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
/* A plain card: the class shows as its class icon and the name in class color, with no color wash or stripe. */
.pcard{display:flex;flex-direction:column;gap:12px;padding:10px 12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--slot)}
.pcard:hover{border-color:var(--line-2)}
.pc-cls{width:22px;height:22px;border-radius:50%;box-shadow:0 0 0 2px var(--c)}
.pc-name{display:flex;align-items:center;gap:8px;min-width:0;font-weight:700;font-size:13px;color:var(--cn)}
.pc-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-name em{margin-left:auto;padding:0 6px;border-radius:8px;background:var(--panel-2);font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.fx-mini{width:16px;height:16px;border-radius:50%}
.pc-icons{display:flex;flex-wrap:wrap;gap:12px 13px;padding:4px 0 0 4px}
.pi{position:relative;display:block;border-radius:6px;box-shadow:0 0 0 2px var(--c)}
.pi .ic{width:30px;height:30px;border-radius:6px}
.pi .pn{position:absolute;top:-7px;left:-7px;z-index:1;display:grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--panel);box-shadow:0 0 0 1px var(--line-2);color:var(--soft);font-style:normal;font-size:9px;font-weight:700}
.pi.rank1 .pn{background:var(--accent);box-shadow:none;color:var(--accent-ink)}
.pi .rd{position:absolute;right:-3px;bottom:-3px;width:9px;height:9px;box-shadow:0 0 0 2px var(--slot)}
.pi.rank2{opacity:.85}.pi.rank3{opacity:.7}.pi.rank4{opacity:.55}
.pi.sug{opacity:1;box-shadow:0 0 0 2px var(--c),0 0 0 4px var(--ok)}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;margin:0 0 12px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-2px;border-radius:3px;background:var(--slot)}
.legend .l-sug{box-shadow:0 0 0 2px var(--ok)}
.legend .lr{display:inline-flex;align-items:center;gap:5px}
.legend .lr .rd{width:8px;height:8px;margin:0;border-radius:50%;background:var(--rc)}

/* Horde or Alliance (easter egg) */
.f-a{--fc:#3a7bff}
.f-h{--fc:#e5413a}
.f-d{--fc:#d4a73a}
.fx-btn{flex:none;display:grid;place-items:center;width:28px;height:28px;padding:0;border:1px dashed var(--line-2);border-radius:50%;background:none;color:var(--muted);font-weight:700;font-size:13px;overflow:hidden;transition:transform .12s,border-color .12s}
.fx-btn:hover{border-color:var(--accent);color:var(--accent);transform:scale(1.1)}
span.fx-btn:hover{transform:none}
.fx-btn.f-a,.fx-btn.f-h,.fx-btn.f-d{border:0;box-shadow:0 0 0 2px var(--fc)}
.fx-btn .ic{width:28px;height:28px;border-radius:50%}
.fx-btn.ghost{visibility:hidden}
.fx-dialog{text-align:center}
.fx-dialog h3{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 0 4px;font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.fx-dialog h3 .ic{width:34px;height:34px;border-radius:50%}
.fx-who{margin:0 0 14px;color:var(--muted)}
.fx-choices{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 4px}
.fx-vs{font-family:var(--display);font-size:22px;font-weight:700;color:var(--faint)}
.fx-choice{display:flex;flex-direction:column;align-items:center;gap:10px;width:min(170px,38vw);padding:18px 12px 14px;border:1px solid var(--line-2);border-radius:10px;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--fc) 30%,transparent),var(--panel-2) 70%);transition:transform .15s,box-shadow .15s,border-color .15s}
.fx-choice img{width:min(96px,22vw);height:min(96px,22vw);border-radius:50%;box-shadow:0 0 0 3px var(--fc),0 0 24px color-mix(in srgb,var(--fc) 60%,transparent)}
.fx-choice span{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff}
.fx-choice:hover,.fx-choice:focus-visible{transform:translateY(-3px);border-color:var(--fc);box-shadow:0 10px 30px color-mix(in srgb,var(--fc) 35%,transparent)}
.fx-choice.on{border-color:var(--fc)}
.fx-any{display:inline-flex;align-items:center;gap:8px;margin:12px auto 2px;padding:6px 14px 6px 6px;border:1px dashed var(--line-2);border-radius:999px;background:var(--panel-2);color:var(--text);font-weight:700;transition:border-color .15s,box-shadow .15s}
.fx-any .ic{width:28px;height:28px;border-radius:50%;box-shadow:0 0 0 2px var(--fc)}
.fx-any small{font-weight:400;color:var(--muted)}
.fx-any:hover,.fx-any:focus-visible,.fx-any.on{border-style:solid;border-color:var(--fc);box-shadow:0 0 18px color-mix(in srgb,var(--fc) 30%,transparent)}
.fx-cheer{border-color:var(--fc);box-shadow:0 0 60px color-mix(in srgb,var(--fc) 35%,transparent)}
.fx-cheer h3{color:var(--fc)}
.fx-photo{display:block;max-width:100%;max-height:60vh;margin:8px auto 10px;border-radius:8px;box-shadow:0 0 0 2px var(--fc)}
.fx-dialog .row{justify-content:center;gap:8px}
.fx-score{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fx-side{display:flex;align-items:center;gap:10px}
.fx-side.f-a{text-align:right}
.fx-side .ic{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 2px var(--fc)}
.fx-side b{display:block;font-family:var(--display);font-size:28px;line-height:1;color:var(--fc)}
.fx-side span{font-size:11.5px;font-weight:600;color:var(--soft)}
.fx-bar{display:flex;gap:3px;height:10px;margin:12px 0 2px;border-radius:5px;overflow:hidden;background:var(--slot)}
.fx-bar i{display:block;height:100%;background:var(--fc);transition:width .4s}
.fx-bar.empty i{opacity:.25}
.fx-none{margin:10px 0 0}
.fx-none .fx-mini{display:inline-block;margin-right:6px;vertical-align:-4px;box-shadow:0 0 0 1px var(--fc,#d4a73a)}

/* Joining: name + button, then faction and spec dialogs */
.su.new{gap:8px}
.su.new .su-name{flex:1 1 auto;width:auto}
.btn.join{flex:none;height:30px}
.btn.pick-specs{height:26px;padding:0 10px;font-size:11.5px;border-style:dashed}
.step{margin:0 0 2px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.step:empty{display:none}
.sp-dialog{width:min(820px,100%);text-align:left}
.sp-dialog h3{margin:0 0 2px;font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff}
.sp-dialog .fx-who{margin:0 0 10px}
.sp-order{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;margin:0 0 12px;padding:6px;border:1px dashed var(--line-2);border-radius:6px;background:var(--slot)}
.sp-empty{align-self:center;padding:0 4px;font-size:12px;color:var(--faint)}
.sp-pick{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px 0 3px;border-radius:5px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 26%,var(--panel-2)),var(--panel-2));box-shadow:inset 3px 0 0 var(--c);font-size:12px;font-weight:700;color:var(--cn)}
.sp-pick b{display:grid;place-items:center;width:18px;height:18px;margin-left:3px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:10.5px}
.sp-pick .ic{width:22px;height:22px}
.sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;max-height:min(56vh,520px);overflow-y:auto;padding:2px}
.sp-class{padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);box-shadow:inset 0 2px 0 var(--c)}
.sp-class.has{border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.sp-class.locked{opacity:.35}
.sp-class h4{margin:2px 2px 6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--cn)}
.sp-specs{display:grid;gap:4px}
.sp-spec{position:relative;display:flex;align-items:center;gap:8px;height:34px;padding:0 8px 0 3px;border:1px solid transparent;border-radius:5px;background:var(--slot);text-align:left;transition:border-color .12s,background .12s}
.sp-spec .ic{width:28px;height:28px}
.sp-spec .sp-name{flex:1;min-width:0;font-size:12.5px;font-weight:600;color:var(--soft)}
.sp-spec:hover:not(:disabled){border-color:var(--c)}
.sp-spec.on{border-color:var(--c);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 28%,var(--slot)),var(--slot))}
.sp-spec.on .sp-name{color:#fff}
.sp-spec em{position:absolute;top:-6px;left:-6px;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-style:normal;font-size:10.5px;font-weight:700}
.sp-spec:disabled{cursor:not-allowed}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Faction crests fixed on both sides (wide screens only; the content keeps a gutter for them) */
.crest{display:none;position:fixed;top:50%;z-index:0;height:auto;transform:translateY(-45%);pointer-events:none;user-select:none;opacity:.92}
.crest-h{filter:drop-shadow(0 0 28px rgba(229,65,58,.35))}
.crest-a{filter:drop-shadow(0 0 28px rgba(58,123,255,.35))}
@media (min-width:1200px){
  :root{--crest:clamp(88px,7vw,190px);--gutter:calc(var(--crest) + 36px)}
  .layout,.audit{position:relative;z-index:1;max-width:calc(1520px + 2 * var(--gutter));padding-left:var(--gutter);padding-right:var(--gutter)}
  .crest{display:block;width:var(--crest)}
  /* each crest sits in the middle of its side band (window edge to content edge) */
  :root{--band:calc(max(0px, (100vw - 1520px - 2 * var(--gutter)) / 2) + var(--gutter))}
  .crest-h{width:calc(var(--crest) * .72);left:calc((var(--band) - var(--crest) * .72) / 2)}
  .crest-a{right:calc((var(--band) - var(--crest)) / 2)}
}

/* Changelog dialog */
.dialog.cl-dialog{width:min(900px,100%)}
.cl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.cl-head h3{margin:0;font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff}
.cl-wrap{max-height:min(62vh,640px);overflow-y:auto;overflow-x:hidden;border:1px solid var(--line);border-radius:6px}
.cl-table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:12.5px}
.cl-table .c-when{width:86px}.cl-table .c-who{width:118px}.cl-table .c-name{width:130px}
.cl-table th{position:sticky;top:0;z-index:1;padding:8px 10px;background:var(--panel-2);text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cl-table td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle;color:var(--soft)}
.cl-table tbody tr:nth-child(even) td{background:rgba(255,255,255,.015)}
.cl-when{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)!important;cursor:help}
.cl-name{font-weight:700;color:#fff!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-who{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;font-weight:700;color:var(--soft);white-space:nowrap}
.cl-who.admin{padding:1px 8px;border-radius:10px;background:rgba(242,184,75,.15);color:var(--accent)}
.cl-who.anon{color:var(--muted);font-weight:600}
.cl-what{line-height:1.9;overflow-wrap:anywhere}
.cl-specs{display:inline-flex;flex-wrap:wrap;gap:3px;vertical-align:middle;margin:0 2px}
.cl-specs .ic,.cl-fx{width:20px;height:20px;border-radius:4px;vertical-align:middle}
.cl-fx{display:inline-block;border-radius:50%;margin:0 2px}
.cl-arrow{margin:0 6px;color:var(--faint);font-weight:700}
.cl-none{color:var(--faint);font-style:italic}
.cl-tag{padding:1px 8px;border-radius:10px;background:var(--panel-2);font-size:11px;font-weight:700;color:var(--soft)}
.cl-tag.ok{background:rgba(76,196,107,.14);color:var(--ok)}
.cl-empty{margin:18px 0;text-align:center;color:var(--muted)}
/* phones: each change as two lines (when + who, then player + change), no table columns */
@media (max-width:640px){
  .cl-table thead{display:none}
  .cl-table,.cl-table tbody{display:block}
  .cl-table tr{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 10px;border-top:1px solid var(--line)}
  .cl-table td{padding:0;border:0;background:none!important}
  .cl-table .cl-what{grid-column:1 / -1}
}
.cl-pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:12px;color:var(--muted)}

/* Notice on arrival */
.notice{width:min(480px,100%);border-color:var(--accent);box-shadow:0 0 50px rgba(242,184,75,.18)}
.notice h3{margin:0 0 10px;font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:#fff}
.notice p{margin:0 0 10px;font-size:13px;line-height:1.5;color:var(--soft)}
.notice p b{color:#fff}
.notice .notice-date{padding:10px 12px;border-radius:6px;background:rgba(242,184,75,.1);box-shadow:inset 3px 0 0 var(--accent);font-size:14px}
.notice .notice-date b{color:var(--accent)}
.notice .notice-date span{color:var(--muted);font-size:12px}

/* Copy dialog and toast */
.overlay{position:fixed;inset:0;z-index:30;display:flex;overflow-y:auto;padding:16px;background:rgba(0,0,0,.7)}
.dialog{margin:auto;width:min(560px,100%);padding:16px;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--radius)}
.dialog h3{margin:0 0 10px;font-size:14px;color:#fff}
.dialog textarea{width:100%;height:240px;padding:10px;background:#000;color:var(--text);border:1px solid var(--line-2);border-radius:5px;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace}
.dialog .row{display:flex;justify-content:flex-end;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;max-width:calc(100% - 32px);padding:9px 16px;background:var(--text);color:#000;font-weight:600;font-size:12px;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:700px){
  .top{position:static}
  .brand h1{font-size:20px}
}
@media (max-width:520px){
  .su:not(.new){display:grid;grid-template-columns:auto minmax(0,1fr) repeat(3,auto);row-gap:6px}
  .su:not(.new) .su-name{width:auto}
  .su:not(.new) .su-specs{grid-column:1 / -1;order:5;padding-left:36px}
  .su.new{flex-wrap:wrap}
  .su.new .btn.join{flex:1 1 100%}
  .grid{grid-template-columns:minmax(0,1fr)}
}

    ["hit", 3], ["spirit", 3], ["shadowres", 3], ["tongues", 3], ["natureres", 2], ["mortal", 2]
  ];
  // heal: healers wanted; off: one more who can heal (an off-healer, or one extra healer); shaman to shamanMax shamans.
  function targets(size) {
    return size <= 10
      ? { tank: 2, heal: 2, off: 1, shaman: 1, shamanMax: 2, paladin: 1, kick: 2 }
      : { tank: 2, heal: 3, off: 1, shaman: 2, shamanMax: 3, paladin: 2, kick: 3 };
  }
  // entries: [{ k: chosen spec, c: that player's signup specs }]
  function compScore(entries, t) {
    const cls = {}, role = { tank: 0, heal: 0, melee: 0, range: 0 }, tags = new Set(), seen = {};
    let off = 0, dup = 0, kick = 0, offTank = 0;
    entries.forEach(({ k, c }) => {
      const sp = SPEC[k];
      if (HYBRID_DPS.has(k) && seen[k]) dup++;
      seen[k] = true;
      cls[sp.cls] = (cls[sp.cls] || 0) + 1;
      role[sp.role]++;
      if (isOffHeal(k)) off++;
      if (isOffTank(k, c)) offTank++;
      if (canKick(k)) kick++;
      specTags(sp).forEach((x) => tags.add(x));
    });
    const groups = Math.max(1, Math.ceil(entries.length / 5));
    // Exactly t.tank tanks (2): a third tank is a dps lost, so a player who listed tank first plays their dps spec.
    // One off-tank (a dps who also signed up as tank) is a small plus: how much it matters in Forever is not clear yet.
    let s = 40 * Math.min(role.tank, t.tank) - 30 * Math.max(0, role.tank - t.tank) + (offTank ? 4 : 0);
    // Healers, then one off-healer: a hybrid in a dps spec, or else one extra healer. An extra healer that the
    // off-healer slot does not need costs a little dps; beyond healers + off-healer it costs more.
    const extraHeal = Math.max(0, role.heal - t.heal);
    s += 30 * Math.min(role.heal, t.heal) + 12 * Math.min(t.off, off + extraHeal);
    s -= 6 * Math.max(0, extraHeal - Math.max(0, t.off - off)) + 9 * Math.max(0, extraHeal - t.off);
    s -= HYBRID_DUP_COST * dup;
    // Melee against ranged, healers counted as ranged: lose points for every melee too many, gain a little for extra ranged.
    const ranged = role.range + role.heal;
    s -= 10 * Math.max(0, role.melee - ranged);
    s += 3 * Math.min(2, Math.max(0, ranged - role.melee));
    // Shamans: the first ones bring the raid totems (see TOTEMS); one more adds water totems for a group; more, no gain.
    const sham = cls.shaman || 0;
    s += 26 * Math.min(sham, t.shaman) + 8 * Math.max(0, Math.min(sham, t.shamanMax) - t.shaman) - 12 * Math.max(0, sham - t.shamanMax);
    const pal = cls.paladin || 0;
    BLESSINGS.slice(0, pal).forEach(([, w]) => { s += w; });
    s += 10 * Math.min(pal, t.paladin);
    if (pal) s += 4 + 3 * (Math.min(pal, groups) - 1); // a paladin aura reaches one group
    s += 8 * Math.min(kick, t.kick);
    // The first warlock brings utility no tag covers (Healthstones, summoning, Soulstone on top of a curse): worth a lot.
    // More warlocks add only a second curse.
    if (cls.warlock) s += FIRST_WARLOCK + (cls.warlock >= 2 ? 5 : 0);
    NEEDS.forEach(([tag, w]) => { if (tags.has(tag)) s += w; });
    return s;
  }

  // Players the suggested comp can use: approved signups that the admin did not put on the bench.
  const compPlayers = () => [...signupsByName().values()].filter((u) => !u.b);

  // When more players signed up than the raid holds, one comp leaves people out. So the panel offers options:
  // option 1 is the best comp; each next option must take everyone no earlier option had room for, until
  // everyone plays in at least one.
  const MAX_OPTIONS = 5;
  let suggestMemo = { key: "", out: null };
  let suggestIdx = 0; // the option shown (and used by "Use this comp")
  function suggestOptions() {
    const key = state.size + "|" + pets + "|" + JSON.stringify(state.signups);
    if (suggestMemo.key === key) return suggestMemo.out;
    const players = compPlayers(), t = targets(state.size);
    // Players the admin locked in are in every option (earlier signups first if they are more than the seats).
    const locked = players.map((u, i) => i).filter((i) => players[i].r).slice(0, state.size);
    const options = [solveComp(players, state.size, t, new Set(locked))];
    const covered = new Set(options[0].raid.map((m) => m.i));
    while (covered.size < players.length && options.length < MAX_OPTIONS) {
      const forced = new Set(locked.concat(players.map((u, i) => i).filter((i) => !covered.has(i))).slice(0, state.size));
      const opt = solveComp(players, state.size, t, forced);
      opt.adds = players.filter((u, i) => forced.has(i) && !u.r);
      if (!opt.adds.length) break; // the locked players fill every seat
      opt.raid.forEach((m) => covered.add(m.i));
      options.push(opt);
    }
    const out = { options, t };
    suggestMemo = { key, out };
    return out;
  }
  // The option on screen, shaped as before: { raid, bench, slots, t } plus the full list.
  function suggest() {
    const { options, t } = suggestOptions();
    suggestIdx = Math.min(suggestIdx, options.length - 1);
    return { ...options[suggestIdx], t, options };
  }

  // Best comp for these players. forced: indexes of players who must be in the raid.
  function solveComp(players, size, t, forced) {
    const n = players.length, cap = Math.min(n, size);
    // pick[i] is an index into players[i].c, or -1 when benched. Forced players first, then earlier signups.
    const order = players.map((u, i) => i).sort((a, b) => (forced.has(b) - forced.has(a)) || a - b);
    const pick = players.map(() => -1);
    order.slice(0, cap).forEach((i) => { pick[i] = 0; });
    const value = (p) => {
      let s = 0;
      const entries = [];
      p.forEach((r, i) => {
        if (r < 0) { s -= 0.1 * (n - i); return; }
        entries.push({ k: players[i].c[r], c: players[i].c });
        s -= PREF_COST(r);
      });
      return s + compScore(entries, t);
    };
    // Hill climbing: take the best single change (or swap with the bench) until nothing improves,
    // then try changing two players at once to get past spots where one change alone does not pay off.
    let best = value(pick);
    const tryMove = (p) => { const v = value(p); if (v > best + 1e-9) { best = v; return true; } return false; };
    const options = players.reduce((s, u) => s + u.c.length, 0);
    for (let guard = 0; guard < 200; guard++) {
      let improved = null;
      for (let i = 0; i < n; i++) {
        for (let r = 0; r < players[i].c.length; r++) {
          if (r === pick[i]) continue;
          if (pick[i] >= 0) {
            const p = pick.slice(); p[i] = r;
            if (tryMove(p)) improved = p;
          } else {
            for (let j = 0; j < n; j++) {
              if (pick[j] < 0 || forced.has(j)) continue;
              const p = pick.slice(); p[i] = r; p[j] = -1;
              if (tryMove(p)) improved = p;
            }
          }
        }
      }
      if (!improved && options <= 80) {
        for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
          if (pick[i] < 0 || pick[j] < 0) continue;
          for (let a = 0; a < players[i].c.length; a++) for (let b = 0; b < players[j].c.length; b++) {
            if (a === pick[i] && b === pick[j]) continue;
            const p = pick.slice(); p[i] = a; p[j] = b;
            if (tryMove(p)) improved = p;
          }
        }
      }
      if (!improved) break;
      improved.forEach((r, i) => { pick[i] = r; });
    }
    const raid = [], bench = [];
    players.forEach((u, i) => { if (pick[i] < 0) bench.push(u); else raid.push({ u, i, n: u.n, s: u.c[pick[i]], rank: pick[i] }); });
    return { raid, bench, slots: arrange(raid, size), adds: [] };
  }

  // Spread players over groups of five: tanks and melee together, casters together, and one healer, shaman, paladin
  // and warlock per group where possible. Shamans lean to casters and healers, who use their water totems most.
  // How good one group of five is, as party buffs and habits go:
  // - one shaman per group (Mana Spring and the group totems); a second one in a group only if every group has one;
  // - one healer per group, healers spread evenly;
  // - the shadow priest with healers, for the mana;
  // - one paladin per group (auras) and one warlock per group (Blood Pact), when there are enough to go around;
  // - tanks together with a paladin (Devotion Aura); melee with melee, casters with casters.
  function groupScore(g, groups, n) {
    const ms = g.map((x) => SPEC[x.s]), count = (f) => ms.filter(f).length, G = groups.length;
    const all = (f) => groups.reduce((s, gr) => s + gr.filter((x) => f(SPEC[x.s])).length, 0);
    const spread = (f, w) => { // w for having one; minus w for each extra while some group has none
      const here = count(f), total = all(f);
      return (here ? w : 0) - (here > 1 && total < G * here ? (here - 1) * w : 0);
    };
    let v = 0;
    v += spread((sp) => sp.cls === "shaman", 20);
    v += spread((sp) => sp.role === "heal", 14);
    v += spread((sp) => sp.cls === "paladin", 8);
    v += spread((sp) => sp.cls === "warlock", 4);
    const heals = count((sp) => sp.role === "heal"), shadow = count((sp) => sp.key === "priest_shadow");
    if (shadow && heals) v += 12; // Vampiric Embrace's mana and health go to the group
    if (count((sp) => sp.role === "tank") && count((sp) => sp.cls === "paladin")) v += 4;
    const phys = count((sp) => sp.role === "tank" || sp.role === "melee"), casters = count((sp) => sp.role === "range");
    v += 1.5 * (phys * (phys - 1) / 2 + casters * (casters - 1) / 2) - 1 * phys * casters;
    v -= 0.01 * Math.abs(g.length - n / G); // even group sizes on ties
    return v;
  }
  function arrange(raid, size) {
    const G = Math.min(size / 5, Math.max(1, Math.ceil(raid.length / 5)));
    const groups = Array.from({ length: G }, () => []);
    const phys = (sp) => sp.role === "tank" || sp.role === "melee" || sp.cls === "hunter";
    const caster = (sp) => sp.role === "range" && sp.cls !== "hunter";
    const order = (m) => { const sp = SPEC[m.s]; return sp.role === "tank" ? 0 : sp.cls === "shaman" || sp.cls === "paladin" ? 1 : sp.role === "heal" ? 4 : phys(sp) ? 2 : 3; };
    raid.slice().sort((a, b) => order(a) - order(b)).forEach((m) => {
      const sp = SPEC[m.s];
      let bestG = 0, bestV = -Infinity;
      groups.forEach((g, gi) => {
        if (g.length >= 5) return;
        const ms = g.map((x) => SPEC[x.s]), count = (f) => ms.filter(f).length;
        let v = -0.5 * g.length;
        if (phys(sp)) v += 4 * count(phys) - 3 * count(caster);
        if (caster(sp)) v += 4 * count(caster) - 3 * count(phys);
        if (sp.role === "heal") v -= 10 * count((x) => x.role === "heal");
        if (sp.cls === "shaman") v += 2 * count((x) => caster(x) || x.role === "heal") - 15 * count((x) => x.cls === "shaman");
        if (sp.cls === "paladin") v -= 12 * count((x) => x.cls === "paladin");
        if (sp.cls === "warlock") v -= 4 * count((x) => x.cls === "warlock");
        if (v > bestV) { bestV = v; bestG = gi; }
      });
      groups[bestG].push(m);
    });
    // Then swap players between groups (or move one into a free seat) while the whole raid scores better.
    const total = () => groups.reduce((s, g) => s + groupScore(g, groups, raid.length), 0);
    let best = total();
    for (let guard = 0; guard < 60; guard++) {
      let improved = false;
      for (let a = 0; a < G; a++) for (let b = a + 1; b < G; b++) {
        const A = groups[a], B = groups[b];
        for (let i = 0; i <= A.length; i++) for (let j = 0; j <= B.length; j++) {
          if (i === A.length && j === B.length) continue;
          if (i === A.length && A.length >= 5) continue; // B[j] cannot move into a full group
          if (j === B.length && B.length >= 5) continue;
          const x = A[i], y = B[j];
          if (x) A.splice(i, 1); if (y) B.splice(j, 1);
          if (y) A.splice(i, 0, y); if (x) B.splice(j, 0, x);
          const v = total();
          if (v > best + 1e-9) { best = v; improved = true; continue; }
          if (y) A.splice(i, 1); if (x) B.splice(j, 1); // undo
          if (x) A.splice(i, 0, x); if (y) B.splice(j, 0, y);
        }
      }
      if (!improved) break;
    }
    // Inside a group: tanks first, then melee, ranged, healers.
    const inGroup = { tank: 0, melee: 1, range: 2, heal: 3 };
    groups.forEach((g) => g.sort((a, b) => inGroup[SPEC[a.s].role] - inGroup[SPEC[b.s].role]));
    const slots = Array(MAX).fill(null);
    groups.forEach((g, gi) => g.forEach((m, k) => { slots[gi * 5 + k] = m; }));
    return slots;
  }

  /* ---------- Rendering ---------- */
  // The hand-edited raid groups card is gone; its code still draws into a detached element, which nobody sees.
  const tools = $("#tools"), grid = $("#grid") || document.createElement("div"), signups = $("#signups"), buffs = $("#buffs"), banner = $("#banner"), dialogRoot = $("#dialog-root");
  const benchEl = $("#bench");
  const suggestEl = $("#suggest"), prefsEl = $("#prefs"), factionsEl = $("#factions");

  function renderTools() {
    const status = !loaded && net === "connecting" ? ["", "Connecting…"]
      : net === "nostore" ? ["bad", "No database"]
      : net === "offline" ? ["bad", "Offline, retrying"]
      : inFlight || pending ? ["busy", "Saving…"]
      : ["ok", "Live"];
    tools.innerHTML =
      (adminOk ? '<div class="seg" role="group" aria-label="View">' + [["roster", "Roster"], ["audit", "Audit"]].map(([v, label]) =>
        '<button type="button" data-act="view" data-v="' + v + '" aria-pressed="' + (view === v) + '">' + label +
        (v === "audit" && adminAsks ? ' <b class="tab-badge" title="Claim requests to answer">' + adminAsks + "</b>" : "") + "</button>").join("") + "</div>" : "") +
      '<div class="seg" role="group" aria-label="Raid size"><span>Size</span>' +
      SIZES.map((s) => '<button type="button" data-size="' + s + '" aria-pressed="' + (state.size === s) + '"' + (adminOk ? "" : ' disabled title="Only the admin changes the raid size"') + ">" + s + "</button>").join("") + "</div>" +
      '<button type="button" class="btn" data-act="pets" aria-pressed="' + pets + '">Hunter pets: ' + (pets ? "On" : "Off") + "</button>" +
      '<button type="button" class="btn" data-act="copy">Copy roster</button>' +
      (adminOk ? "" : '<button type="button" class="btn" data-act="changelog" title="Who changed what, newest first">Changelog</button>') +
      (discordId ? (session ? '<button type="button" class="btn" data-act="sign-out" title="Signed in with Discord. Click to sign out.">' + esc(meUser ? meUser.name : "Signed in") + " · Sign out</button>"
        : '<button type="button" class="btn discord" data-act="sign-in">Sign in with Discord</button>') : "") +
      (adminKey ? '<button type="button" class="btn admin" data-act="admin-off" title="Admin mode: the faction change limit is off on this browser. Click to turn admin mode off.">Admin</button>' : "") +
      '<span class="live ' + status[0] + '" role="status"><i></i>' + status[1] + "</span>";
  }

  const ROLE_UI = [["tank", "Tanks", "ability_warrior_defensivestance"], ["heal", "Healers", "spell_holy_flashheal"], ["melee", "Melee", "ability_dualwield"], ["range", "Ranged", "ability_marksmanship"]];
  const STAT_UI = { int: "Int", agi: "Agi", str: "Str" };
  const ARMOR_UI = [ // [label, icon, [[armor key, stat]]]
    ["Cloth", "inv_chest_cloth_21", [["cloth", "int"]]],
    ["Leather", "inv_chest_leather_09", [["leather_int", "int"], ["leather_agi", "agi"]]],
    ["Mail", "inv_chest_chain_05", [["mail_int", "int"], ["mail_agi", "agi"]]],
    ["Plate", "inv_chest_plate06", [["plate_int", "int"], ["plate_str", "str"]]]
  ];
  // Roles as tiles and armor as bars, so loot overlap shows at a glance. (Forever has no tier tokens.)
  function compHTML(a) {
    const total = Math.max(a.players, 1);
    const bar = (segs) => '<span class="bar">' + segs.filter((s) => s[0]).map(([n, color, tip]) => '<i style="width:' + (100 * n / total) + "%;background:" + color + '" title="' + esc(tip) + '"></i>').join("") + "</span>";
    const roles = ROLE_UI.map(([k, label, icon]) => {
      const n = a.roles[k];
      return '<div class="role r-' + k + (n ? "" : " zero") + '">' + img(icon) + "<b>" + n + "</b><span>" + label + "</span></div>";
    }).join("");
    const armor = ARMOR_UI.map(([label, icon, parts]) => {
      const n = parts.reduce((s, [k]) => s + (a.armor[k] || 0), 0);
      const legend = parts.map(([k, st]) => '<span class="st s-' + st + '"><i></i>' + (a.armor[k] || 0) + " " + STAT_UI[st] + "</span>").join("");
      return '<div class="meter' + (n ? "" : " zero") + '">' + img(icon) + '<div class="m-body"><div class="m-top"><span>' + label + "</span><b>" + n + "</b></div>" +
        bar(parts.map(([k, st]) => [a.armor[k] || 0, "var(--" + st + ")", (a.armor[k] || 0) + " " + label + " " + STAT_UI[st]])) + '<div class="m-legend">' + legend + "</div></div></div>";
    }).join("");
    return '<div class="comp">' +
      '<div class="ccard"><h4>Roles <small>' + a.players + " / " + state.size + " players</small></h4>" + '<div class="roles">' + roles + "</div></div>" +
      '<div class="ccard"><h4>Armor</h4>' + armor + "</div></div>";
  }

  // state.signups is in signup order; the page shows the newest first.
  const newestFirst = () => state.signups.slice().reverse();

  // For the selected empty slot: every spec of every approved signup that is not in the raid yet.
  function pickHTML(i) {
    const placed = new Set(state.slots.filter(Boolean).map((m) => m.n.toLowerCase()));
    const opts = newestFirst().filter((u) => u.n && u.c.length && !u.p && !placed.has(u.n.toLowerCase())).map((u) =>
      '<optgroup label="' + esc(u.n) + '">' + u.c.map((k) => '<option value="' + esc(u.id) + "|" + k + '">' + esc(specName(SPEC[k])) + "</option>").join("") + "</optgroup>").join("");
    return opts ? '<select class="pick" data-i="' + i + '" aria-label="Pick a signup for this slot"><option value="">Pick a signup…</option>' + opts + "</select>"
      : '<span class="nm anon">Every signup is in the raid</span>';
  }

  function cellHTML(i) {
    const m = state.slots[i], g = Math.floor(i / 5) + 1, k = (i % 5) + 1;
    const selCls = sel === i ? " sel" : "";
    if (!m) return '<div class="cell empty' + selCls + '" data-i="' + i + '" role="button" tabindex="0" aria-label="Group ' + g + ", slot " + k + ': empty">' + (sel === i ? pickHTML(i) : "") + "</div>";
    const sp = SPEC[m.s], c = CLASS[sp.cls], full = specName(sp);
    const isEdit = editing === i;
    const label = isEdit
      ? '<input id="name-input" maxlength="' + NAME_MAX + '" autocomplete="off" spellcheck="false" placeholder="Name" aria-label="Player name" value="' + esc(draftName) + '">'
      : '<span class="nm' + (m.n ? "" : " anon") + '">' + esc(m.n || full) + "</span>";
    const u = m.n ? signupsByName().get(m.n.toLowerCase()) : null;
    const rank = u ? u.c.indexOf(m.s) : -1;
    const tip = (m.n ? m.n + ": " : "") + full + (u ? (rank >= 0 ? " (" + ordinal(rank + 1) + " choice)" : " (not on their list)") + ". Wants: " + u.c.map((x) => specName(SPEC[x])).join(" > ") : "");
    return '<div class="cell filled' + selCls + (isEdit ? " editing" : "") + '" data-i="' + i + '" draggable="' + !isEdit + '" role="button" tabindex="0" style="--c:' + c.color + ";--cn:" + (c.text || c.color) + '" title="' + esc(tip) + '" aria-label="Group ' + g + ", slot " + k + ": " + esc((m.n ? m.n + ", " : "") + full) + '">' +
      img(sp.icon) + label + (u && !isEdit ? prioHTML(u.c, m.s) : "") + '<button type="button" class="x" data-act="remove" aria-label="Remove ' + esc(m.n || full) + '">&times;</button></div>';
  }
  // The player's signup specs, best first, with the one they are playing lit up.
  // Click one to make it the spec the player plays in this slot.
  function prioHTML(c, cur) {
    return '<span class="prio">' + c.slice(0, 4).map((k, r) => {
      const label = ordinal(r + 1) + " choice: " + specName(SPEC[k]) + (k === cur ? " (playing)" : ". Click to play this.");
      return '<button type="button" class="pr' + (k === cur ? " cur" : "") + '" data-act="main-spec" data-spec="' + k + '" title="' + esc(label) + '" aria-label="' + esc(label) + '" aria-pressed="' + (k === cur) + '">' + img(SPEC[k].icon) + "</button>";
    }).join("") + "</span>";
  }

  function renderGrid(a) {
    let h = "";
    for (let g = 0; g < state.size / 5; g++) {
      let cells = "";
      for (let i = g * 5; i < g * 5 + 5; i++) cells += cellHTML(i);
      const party = a.party[g].map((t) => img(BUFF[t].icon, "", BUFF[t].sec.replace(/s$/, "") + ": " + BUFF[t].label + " · " + BUFF[t].src)).join("");
      h += '<section class="group" aria-label="Group ' + (g + 1) + '"><h3>Group ' + (g + 1) + "<span>" + state.slots.slice(g * 5, g * 5 + 5).filter(Boolean).length + "/5</span>" + '</h3><div class="cells">' + cells + '</div><div class="party">' + party + "</div></section>";
    }
    grid.innerHTML = h;
    const hidden = state.slots.slice(state.size).filter(Boolean).length;
    if (hidden) grid.insertAdjacentHTML("beforeend", '<p class="foot" style="grid-column:1/-1">' + plural(hidden, "player is", "players are") + " in groups hidden at size " + state.size + (state.size < 20 ? ". Switch to 20 to see them." : ". Clear groups to remove them.") + "</p>");
    if (editing !== null) {
      const input = $("#name-input");
      if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
    }
  }

  // Specs a signup can still add: any class while they have fewer than MAX_CLASSES, then only their own classes.
  function specOptions(c) {
    const own = new Set(c.map((k) => SPEC[k].cls));
    return Object.keys(CLASS).filter((cls) => own.has(cls) || own.size < MAX_CLASSES).map((cls) => {
      const opts = SPEC_ROWS.filter((r) => r[1] === cls && !c.includes(r[0])).map((r) => '<option value="' + r[0] + '">' + esc(r[2] + " " + CLASS[cls].name) + "</option>").join("");
      return opts && '<optgroup label="' + CLASS[cls].name + '">' + opts + "</optgroup>";
    }).join("");
  }
  // placed: lower-case name -> seat in the suggested comp on screen, so a signup shows its group there.
  function signupRow(u, placed) {
    const who = u.n || "this player", i = u.n ? placed.get(u.n.toLowerCase()) : undefined;
    const m = i != null ? suggest().slots[i] : null, g = Math.floor(i / 5) + 1;
    const chips = u.c.map((k) => {
      const sp = SPEC[k], c = CLASS[sp.cls], full = specName(sp);
      const tip = u.p ? full + ". " + who + " is waiting for the admin's approval." : m ? full + ". " + who + " is in group " + g + " of the suggested comp" + (m.s === k ? " as this spec." : ".") : full + ". " + who + " has no seat in the suggested comp on screen.";
      return '<span class="chip' + (m && m.s === k ? " on" : "") + '" draggable="' + !u.p + '" data-spec="' + k + '" style="--c:' + c.color + '">' +
        '<button type="button" data-spec="' + k + '" title="' + esc(tip) + '" aria-label="' + esc(full) + '">' + img(sp.icon) + "</button>" +
        (adminOk ? '<button type="button" class="x" data-act="su-drop" data-spec="' + k + '" aria-label="Remove ' + esc(full) + " from " + esc(who) + '">&times;</button>' : "") + "</span>";
    }).join("");
    // A new player only types a name and joins: faction and specs follow in two dialogs.
    if (!u.id) {
      return '<div class="su new" data-id=""><input class="su-name" maxlength="' + NAME_MAX + '" autocomplete="off" spellcheck="false" placeholder="Your name" aria-label="Your name">' +
        '<button type="button" class="btn primary join" data-act="join">Join the raid</button></div>';
    }
    // Once signed up, only the admin edits the row; the player can still pick a first side and their first specs on
    // their own signup (nobody else's).
    const opts = adminOk ? specOptions(u.c) : "";
    const fx = FACTION[u.f], own = adminOk || u.id === myId;
    const side = (fx && !adminOk) || !own
      ? '<span class="fx-btn' + (fx ? " f-" + u.f : "") + '" title="' + esc(fx ? who + " " + fx.stance + ". Only the admin can change sides." : who + " has not picked a side yet.") + '" aria-label="' + esc(fx ? "Faction: " + fx.name : "No side yet") + '">' + (fx ? img(fx.icon) : "?") + "</span>"
      : '<button type="button" class="fx-btn' + (fx ? " f-" + u.f : "") + '" data-act="fx-open" title="' + esc(fx ? who + " " + fx.stance + ". Click to change." : "¿Horda o Alianza? Pick a side for " + who) + '" aria-label="' + esc(fx ? "Faction: " + fx.name : "Pick Horde or Alliance") + '">' + (fx ? img(fx.icon) : "?") + "</button>";
    // Bench or lock-in shows as a small tag. The admin's actions float over the end of the row on hover,
    // so they take no room from the specs.
    const benchTip = u.b ? who + " is on the bench: left out of the suggested comp." : "Bench " + who + ": leave them out of the suggested comp.";
    const lockTip = u.r ? who + " is locked into the suggested comp: in every option." : "Lock " + who + " into the suggested comp: in every option.";
    const status = u.r ? '<span class="where st-locked" title="' + esc(lockTip) + '">Locked</span>' : u.b ? '<span class="where st-bench" title="' + esc(benchTip) + '">Bench</span>' : "";
    const tool = (act, cls, on, label, title) => '<button type="button" class="tool ' + cls + (on ? " on" : "") + '" data-act="' + act + '" aria-pressed="' + on + '" title="' + esc(title) + '">' + label + "</button>";
    const del = '<button type="button" class="mini" data-act="su-del" title="Remove ' + esc(who) + ' from signups" aria-label="Remove ' + esc(who) + ' from signups">&times;</button>';
    const approve = adminOk && u.p ? '<button type="button" class="mini ok" data-act="su-approve" title="Approve: move ' + esc(who) + ' to the signups" aria-label="Approve ' + esc(who) + '">&#10003;</button>' : "";

    const tools = !adminOk ? "" : '<span class="su-tools">' + (u.p ? approve :
      tool("su-lock", "t-lock", !!u.r, u.r ? "Unlock" : "Lock", lockTip + (u.r ? " Click to unlock." : "")) +
      tool("su-bench", "t-bench", !!u.b, u.b ? "Unbench" : "Bench", benchTip + (u.b ? " Click to take them off the bench." : "")) +
      '<button type="button" class="mini" data-act="su-wait" title="Move ' + esc(who) + ' back to waiting for approval" aria-label="Move ' + esc(who) + ' back to waiting for approval">&#8617;</button>') + del + "</span>";
    return '<div class="su' + (m ? " placed" : "") + (u.p ? " pending" : "") + (u.b ? " benched" : "") + '" data-id="' + esc(u.id) + '">' + side +
      '<input class="su-name" maxlength="' + NAME_MAX + '" autocomplete="off" spellcheck="false" placeholder="Name" aria-label="Name" value="' + esc(u.n) + '"' + (adminOk ? "" : ' readonly title="Only the admin can change a name."') + ">" +
      '<span class="su-specs">' + chips + (u.c.length || !own ? "" : '<button type="button" class="btn pick-specs" data-act="sp-open">Pick specs</button>') + (opts && u.c.length ? '<select class="su-add" title="Add a spec" aria-label="Add a spec for ' + esc(who) + '"><option value="">+</option>' + opts + "</select>" : "") + "</span>" +
      (m ? '<span class="where" title="Group ' + g + ' in the suggested comp">G' + g + "</span>" : "") + status + tools + "</div>";
  }
  // Claims go straight to the server (they are not signup edits): send, show the warning or a note, take the reply.
  // after: called once the server accepted it (no warning).
  function postNow(body, done, after) {
    if (signInFirst()) return;
    fetch(API, { method: "POST", headers: visitorHeaders({ "Content-Type": "application/json" }), body: JSON.stringify(body) })
      .then(readJSON).then((s) => {
        if (s.warning) { toast(s.warning); playBlocked(); } else { if (done) toast(done); if (after) after(); }
        accept(s, true);
      }, (err) => err.status === 401 ? askSignIn(err.message) : toast(err.status === 400 ? "The server rejected that: " + err.message : "Could not reach the server. Try again."));
  }
  // A signed-in player with no signup: their open claim request, or a way to make one.
  function askLine() {
    if (!meUser || adminOk || signedUp) return "";
    const u = myAsk && state.signups.find((x) => x.id === myAsk.id);
    if (u) return '<p class="ask-line">Waiting for the admin to confirm that <b>' + esc(u.n) + '</b> is you. <button type="button" class="btn sm" data-act="ask-open">Change</button></p>';
    return openSignups().length ? '<p class="ask-line">Already on the list? <button type="button" class="btn sm" data-act="ask-open">Claim your signup</button></p>' : "";
  }
  let signupsDirty = false, holdSignups = false;
  function renderSignups() {
    const a = document.activeElement;

    if (holdSignups || (a && signups.contains(a) && (a.tagName === "INPUT" || a.tagName === "SELECT"))) { signupsDirty = true; return; }
    signupsDirty = false;
    const placed = new Map();
    suggest().slots.forEach((m, i) => { if (m && m.n) placed.set(m.n.toLowerCase(), i); });
    const all = newestFirst(), waiting = all.filter((u) => u.p), listed = all.filter((u) => !u.p);
    signups.innerHTML = '<div class="phead"><h2 class="ttl">Signups <span class="count">' + listed.length + "</span></h2></div>" +
      '<p class="hint">Join with your name, pick a side, then your specs (best first, up to ' + MAX_CLASSES + " classes). One signup per person. The admin approves new signups, and after that only the admin can change them. G1–G4 is the player's group in the suggested comp.</p>" + askLine() +
      signupRow({ id: "", n: "", c: [] }, placed) +
      (waiting.length ? '<section class="su-wait" aria-label="Waiting for approval"><h3 class="ttl">Waiting for approval <span class="count">' + waiting.length + "</span></h3>" + waiting.map((u) => signupRow(u, placed)).join("") + "</section>" : "") +
      listed.map((u) => signupRow(u, placed)).join("");

  }

  function renderBuffs(a) {
    let h = "";
    BUFFS.forEach(([sec, party, rows]) => {
      h += '<section class="bsec"><h4>' + sec + (party ? "<small>per group</small>" : "") + "</h4>" + rows.map(([tag, label, icon, src]) => {
        const n = a.tags[tag] || 0;
        return '<button type="button" class="brow' + (n ? " on" : "") + (pinned === tag ? " pin" : "") + '" data-buff="' + tag + '" title="' + esc(src) + '">' + img(icon) + "<b>" + n + "</b><span>" + esc(label) + "</span></button>";
      }).join("") + "</section>";
    });
    const ns = notes(a);

    buffs.innerHTML = '<div class="phead"><h2 class="ttl">Coverage <small>hover or click a row to see who brings it</small></h2></div>' + compHTML(a) + '<div class="buffs-body">' + h + "</div>";

  function rankBadge(rank) {
    return '<span class="rk r' + Math.min(rank + 1, 3) + '" title="' + ordinal(rank + 1) + ' choice">' + ordinal(rank + 1) + "</span>";
  }
  function renderSuggest() {
    const sg = suggest(), raid = sg.raid, t = sg.t;
    if (!raid.length) {
      suggestEl.innerHTML = '<div class="phead"><h2 class="ttl">Suggested comp</h2></div><p class="hint">Once people sign up with their specs, the best comp for them shows here.</p>';
      renderBench([], []);
      return;
    }
    const specs = raid.map((m) => SPEC[m.s]), tags = new Set(specs.flatMap(specTags));
    const count = (f) => specs.filter(f).length;
    const canBring = (f) => compPlayers().some((u) => u.c.some((k) => f(SPEC[k])));
    // Counts always show with their label; buffs show a label only when missing, an icon when covered.
    let missing = "", covered = "";
    const need = (ok, possible, icon, label, title, always) => {
      const tip = esc(title + (ok ? "" : possible ? ". Missing." : ". Nobody signed up can bring it."));
      const bare = ok && !always;
      const h = '<li class="' + (ok ? "ok" : possible ? "miss" : "miss none") + (bare ? " bare" : "") + '" title="' + tip + '">' + img(icon) + (bare ? "" : esc(label)) + "</li>";
      if (always) missing += h; else if (ok) covered += h; else missing += h;
    };
    const tanks = count((sp) => sp.role === "tank"), heals = count((sp) => sp.role === "heal"), pals = count((sp) => sp.cls === "paladin");
    const shams = count((sp) => sp.cls === "shaman");
    need(tanks === t.tank, canBring((sp) => sp.role === "tank"), "ability_warrior_defensivestance", "Tanks " + tanks + "/" + t.tank, t.tank + " tanks, no more", true);
    const offTanks = raid.filter((m) => isOffTank(m.s, m.u.c)).length;
    need(offTanks >= 1, false, "ability_warrior_shieldwall", "Off-tank " + Math.min(offTanks, 1) + "/1", "Optional: a dps who also signed up as tank, in case a fight needs a third", true);
    need(heals >= t.heal && heals <= t.heal + t.off, canBring((sp) => sp.role === "heal"), "spell_holy_flashheal", "Healers " + heals + "/" + t.heal, t.heal + " healers for a raid of " + state.size + ", plus one off-healer", true);
    const offs = Math.min(t.off, raid.filter((m) => isOffHeal(m.s)).length + Math.max(0, heals - t.heal));
    need(offs >= t.off, canBring((sp) => isOffHeal(sp.key)) || canBring((sp) => sp.role === "heal"), "spell_nature_healingtouch", "Off-healer " + offs + "/" + t.off, "A Druid, Paladin, Priest or Shaman in a dps spec who can help heal, or one extra healer", true);
    need(shams >= t.shaman && shams <= t.shamanMax, canBring((sp) => sp.cls === "shaman"), "spell_nature_windfury", "Shamans " + shams + "/" + t.shaman + "–" + t.shamanMax, "One shaman drops Windfury and Strength of Earth for the whole raid. Grace of Air is also an air totem, so it takes a second shaman. One more adds water totems for a group", true);
    const melee = count((sp) => sp.role === "melee"), ranged = count((sp) => sp.role === "range" || sp.role === "heal");
    need(ranged >= melee, true, "ability_marksmanship", "Melee " + melee + " · Ranged " + ranged, "Healers count as ranged. Ranged should match or outnumber melee", true);
    const locks = count((sp) => sp.cls === "warlock");
    need(locks >= 1, canBring((sp) => sp.cls === "warlock"), "spell_shadow_soulgem", "Warlock " + Math.min(locks, 1) + "/1", "One warlock brings Healthstones, summoning, Soulstone and Curse of the Elements; more add little", true);
    const kicks = raid.filter((m) => canKick(m.s)).length;
    need(kicks >= t.kick, [...signupsByName().values()].some((u) => u.c.some(canKick)), "ability_kick", "Interrupts " + kicks + "/" + t.kick, "Players who can interrupt a cast: Warrior, Rogue, Mage, Shaman, Warlock (felhunter), Shadow Priest. Druids, Hunters and Paladins can't", true);
    need(pals >= t.paladin, canBring((sp) => sp.cls === "paladin"), "spell_magic_greaterblessingofkings", "Paladins " + pals + "/" + t.paladin, "Each paladin gives one blessing (Kings, Wisdom, Might, Salvation)", true);
    // One of each main buff: blessings take one paladin each, Grace of Air a second shaman, the rest one provider.
    const buffNeed = (tag, ok, possible) => need(ok, possible, BUFF[tag].icon, BUFF[tag].label, BUFF[tag].label + " · " + BUFF[tag].src);
    BLESSINGS.forEach(([tag], i) => buffNeed(tag, i < pals, canBring((sp) => sp.cls === "paladin")));
    TOTEMS.forEach(([tag, n]) => buffNeed(tag, shams >= n, canBring((sp) => sp.cls === "shaman")));
    NEEDS.forEach(([tag]) => buffNeed(tag, tags.has(tag), canBring((sp) => specTags(sp).includes(tag))));
    const needs = missing + (covered ? '<li class="sep" aria-hidden="true"></li>' + covered : "");
    const ranks = {};
    raid.forEach((m) => { ranks[m.rank] = (ranks[m.rank] || 0) + 1; });
    const rankSum = Object.keys(ranks).sort((a, b) => a - b).map((r) => "<b>" + ranks[r] + "</b> on " + ordinal(+r + 1) + " choice").join(", ");
    let groupsH = "";
    const party = analyze(sg.slots).party;
    // Per group: tanks, healers and dps in the header, and the party-wide buffs the group gets under it.
    const groupRoles = (g) => {
      const ms = sg.slots.slice(g * 5, g * 5 + 5).filter(Boolean).map((m) => SPEC[m.s].role);
      const n = (r) => ms.filter((x) => x === r).length;
      return [["tank", "T", n("tank")], ["heal", "H", n("heal")], ["dps", "D", n("melee") + n("range")]]
        .filter((x) => x[2]).map(([r, l, c]) => '<i class="gr gr-' + r + '" title="' + c + " " + (r === "dps" ? "dps" : r === "heal" ? "healer" + (c > 1 ? "s" : "") : "tank" + (c > 1 ? "s" : "")) + '">' + c + l + "</i>").join("");

        '<button type="button" role="tab" class="sg-tab' + (i === suggestIdx ? " on" : "") + '" data-act="sg-opt" data-i="' + i + '" aria-selected="' + (i === suggestIdx) + '">' +
        "<b>Option " + (i + 1) + "</b><small>" + (i ? "+ " + esc(o.adds.map((u) => u.n).join(", ")) : "best fit") + "</small></button>").join("") + "</div>" +
      '<p class="sg-note">' + plural(compPlayers().length, "player") + " for " + state.size + " seats. Each option after the first brings in the players the earlier ones left out, so everyone plays in at least one.</p>";

    for (let g = 0; g * 5 < outList.length; g++) {
      const part = outList.slice(g * 5, g * 5 + 5);
      const cells = part.map(({ u, why }) => {
        const k = u.c[0], sp = k && SPEC[k], c = sp ? CLASS[sp.cls] : null;
        const tip = u.n + (sp ? ": " + specName(sp) + " (1st choice)" : "") + (why === "admin" ? ". Benched by the admin." : ". No seat in this option.");
        return '<div class="sg-cell benched"' + (c ? ' style="--c:' + c.color + ";--cn:" + (c.text || c.color) + '"' : "") + ' title="' + esc(tip) + '">' + (sp ? img(sp.icon) : "") + '<span class="nm">' + esc(u.n) + '</span><span class="bt">' + (why === "admin" ? "Admin" : "Bench") + "</span></div>";
      }).join("") + '<div class="sg-cell empty"></div>'.repeat(5 - part.length);
      groupsH += '<section class="group bench-group"><h3>Group ' + (raidGroups + g + 1) + "<span>Bench · " + part.length + "</span></h3>" + '<div class="cells">' + cells + "</div></section>";

  }
  // The bench, drawn inline (no image file): a wooden park bench on cast-iron frames with a brass BENCH plaque, and three
