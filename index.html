  /* ---------- Launch calendar ---------- */
  // WoW Forever dates (Blizzard's roadmap as reported by Icy Veins, esports.gg and others, checked 2026-10-19):
  // name reservation 27 Oct - 3 Nov, launch 4 Nov 15:00 PST = 5 Nov 00:00 in mainland Spain (23:00 UTC),
  // first raids (Barrow Deeps, Hyjal Summit, Onyxia) 9 Dec; no hour announced for the raids.
  const LAUNCH = [
    { label: "Names", at: Date.UTC(2026, 9, 27), until: Date.UTC(2026, 10, 3, 23), text: "27 Oct – 3 Nov", tip: "Character name reservation" },
    { label: "Launch", at: Date.UTC(2026, 10, 4, 23), text: "Thu 5 Nov · 00:00", tip: "WoW Forever goes live: 4 Nov 15:00 PST, midnight in mainland Spain" },
    { label: "Raids", at: Date.UTC(2026, 11, 9), text: "Wed 9 Dec", tip: "Barrow Deeps (10), Hyjal Summit (20), Onyxia's Lair (40) open. Time not announced yet" }
  ];
  function launchLeft(ms) {
    const d = Math.floor(ms / 864e5), hr = Math.floor((ms % 864e5) / 36e5), m = Math.floor((ms % 36e5) / 6e4);
    return d ? "in " + d + "d " + hr + "h" : hr ? "in " + hr + "h " + m + "m" : "in " + Math.max(1, m) + "m";
  }
  function renderLaunch() {
    const el = $("#launch");
    if (!el) return;
    const now = Date.now();
    const next = LAUNCH.findIndex((s) => now < (s.until || s.at)); // the first step not over yet
    el.innerHTML = LAUNCH.map((s, i) => {
      const running = s.until && now >= s.at && now < s.until;
      const cls = i < next || next < 0 ? "past" : i === next ? "next" : "";
      const note = i !== next ? "" : running ? "open now" : launchLeft(s.at - now);
      return '<li class="' + cls + '" title="' + esc(s.tip) + '"><b>' + esc(s.label) + "</b><span>" + esc(s.text) + "</span>" + (note ? "<small>" + esc(note) + "</small>" : "") + "</li>";
    }).join("");
  }

  /* ---------- Changelog ---------- */
  // The server logs every change with who made it: the admin, the player (by the signup their browser made), or an
  // anonymous visitor tag. This dialog pages through it, newest first.
  const CL_SIDE = { a: "Alliance", h: "Horde", d: "Either side" };
  function clAgo(t) {
    const s = Math.max(0, Math.round((Date.now() - t) / 1000));
    if (s < 60) return "just now";
    const m = Math.round(s / 60); if (m < 60) return m + " min ago";
    const h = Math.round(m / 60); if (h < 24) return h + " h ago";
    const d = Math.round(h / 24); return d + (d === 1 ? " day ago" : " days ago");
  }
  function clWhen(t) {

  }
  function clWho(w) {

  }

  const clSide = (f) => (FACTION[f] ? img(FACTION[f].icon, "cl-fx", CL_SIDE[f] || "") : '<span class="cl-none">none</span>');
  function clWhat(e) {

  // One page of the changelog as a table, with a pager whose buttons have data-act=act.
  function clTable(d, act) {
    const rows = (d.entries || []).map((e) =>
      '<tr><td class="cl-when" title="' + esc(clWhen(e.t)) + '">' + esc(clAgo(e.t)) + "</td><td>" + clWho(e.w) + '</td><td class="cl-name">' + esc(e.n || "") + '</td><td class="cl-what">' + clWhat(e) + "</td></tr>").join("");

  let clPage = 0;
  function showChangelog(page) {

  // Notice on arrival: until the deadline, players can ask the admin to change their side or specs.

  function showChangesNotice() {

  // Quick spec picker: click specs in order of preference; the order of clicks is the priority.

  // Plays the faction's sound file, or has the browser shout it when there is no file.

        const say = new SpeechSynthesisUtterance(fx.cheer);
        say.lang = "es-ES"; say.pitch = fx.pitch; say.rate = fx.rate; say.volume = 1;

    // "Don't mind" players are counted apart: the Alliance/Horde share is only among those who chose a side.

    if (ov && (t.classList.contains("overlay") || t.dataset.act === "close-dialog")) { if (!ov.classList.contains("locked")) closeDialog(); return; }
    const sizeBtn = t.closest("[data-size]");
    if (sizeBtn) { const z = +sizeBtn.dataset.size; if (z !== state.size && adminOk) { sel = null; change((s) => { s.size = z; }); } return; }
    const act = t.closest("[data-act]");
    if (act) {
      const a = act.dataset.act;
      if (a.startsWith("su-")) { signupAction(a, act.closest(".su").dataset.id, act.dataset.spec); return; }
      if (a === "join") { startJoin(); return; }
      if (a === "join-cancel") { closeDialog(); return; }
      if (a === "sp-open") { showSpecPicker(act.dataset.id || act.closest(".su").dataset.id); return; }
      if (a === "sp-toggle") { toggleSpec(act.dataset.spec); return; }
      if (a === "sp-save") { saveSpecs(); return; }
      if (a === "sign-in") { signIn(); return; }
      if (a === "sign-out") { signOut(); return; }
      if (a === "view") {
        if (act.dataset.v === "audit") location.hash = "audit";
        else { history.pushState(null, "", location.pathname + location.search); readView(); }
        window.scrollTo(0, 0); return;
      }
      if (a === "audit-refresh") { loadAudit(true); return; }
      if (a === "ask-open") { showClaimPicker(); return; }
      if (a === "ask-pick") {
        const u = state.signups.find((x) => x.id === act.dataset.id);
        closeDialog();
        if (u) postNow({ ask: u.id }, "Sent. The admin will confirm that you are " + u.n + ".", checkAdmin);
        return;
      }
      if (a === "ask-ok" || a === "ask-no") {
        const k = act.dataset.k, q = askList.find((x) => x.k === k), u = q && state.signups.find((x) => x.id === q.id);
        postNow(a === "ask-ok" ? { askOk: k } : { askNo: k }, a === "ask-ok" ? (u ? u.n : "The signup") + " is now @" + (q ? q.u : "") + "'s." : "Claim request refused.", () => loadAudit(true));
        return;
      }
      if (a === "au-page") { loadAuditLog(+act.dataset.p); return; }
      if (a === "claim-copy") { const c = claimList.find((x) => x.id === act.dataset.id); if (c) copyText(claimUrl(c), "Claim link for " + c.n + " copied"); return; }
      if (a === "claim-copy-all") { copyText(claimList.filter((c) => !c.by).map((c) => c.n + ": " + claimUrl(c)).join("\n"), "All unclaimed links copied"); return; }
      if (a === "unclaim") { postNow({ unclaim: act.dataset.id }, "Claim undone: the link works again", () => loadAudit(true)); return; }
      if (a === "sp-later") { closeDialog(); return; }
      if (a === "fx-open") { showFactionPicker(act.closest(".su").dataset.id); return; }
      if (a === "fx-pick") { pickFaction(act.dataset.id, act.dataset.f); return; }
      if (a === "fx-replay") { cheer(act.dataset.f); return; }
      if (a === "admin-off") { adminKey = ""; try { localStorage.removeItem(ADMIN_STORE); } catch (err) {} renderTools(); toast("Admin mode is off on this browser."); checkAdmin(); return; }
      if (a === "remove") { removeSlot(+act.closest(".cell").dataset.i); return; }
      if (a === "main-spec") {
        const i = +act.closest(".cell").dataset.i, m = state.slots[i], k = act.dataset.spec;
        if (m && m.s !== k && SPEC[k]) change((s) => { s.slots[i] = { s: k, n: m.n }; });
        return;
      }
      if (a === "pets") {
        pets = !pets;
        try { localStorage.setItem(PETS_KEY, pets ? "on" : "off"); } catch (err) {}
        renderAll(); return;
      }
      if (a === "changelog") { showChangelog(0); return; }
      if (a === "cl-page") { showChangelog(+act.dataset.p); return; }
      if (a === "copy") {
        const text = rosterText();
        try { navigator.clipboard.writeText(text).then(() => toast("Roster copied"), () => showCopyDialog(text)); }
        catch (err) { showCopyDialog(text); }
        return;
      }
      if (a === "clear") {
        if (!clearArmed) { clearArmed = setTimeout(() => { clearArmed = 0; renderTools(); }, 4000); renderTools(); return; }
        clearTimeout(clearArmed); clearArmed = 0; sel = null; editing = null;
        change((s) => { for (let i = 0; i < MAX; i++) s.slots[i] = null; });
        return;
      }
      if (a === "sg-opt") { suggestIdx = +act.dataset.i || 0; useArmed = 0; renderSuggest(); renderPrefs(); return; }
      if (a === "use-suggest") {
        if (!useArmed) { useArmed = setTimeout(() => { useArmed = 0; renderSuggest(); }, 4000); renderSuggest(); return; }
        clearTimeout(useArmed); useArmed = 0; sel = null; editing = null;
        const slots = suggest().slots;
        change((s) => { for (let i = 0; i < MAX; i++) s.slots[i] = slots[i] ? { s: slots[i].s, n: slots[i].n } : null; });
        toast("Groups replaced with the suggested comp");
        return;
      }
    }
    const brow = t.closest(".brow");
    if (brow) { pinned = pinned === brow.dataset.buff ? null : brow.dataset.buff; renderBuffs(analyze()); applyFilter(); return; }
    const cell = t.closest(".cell");
    if (cell) {
      if (t.tagName === "INPUT" || t.tagName === "SELECT" || t.tagName === "OPTION") return;
      const i = +cell.dataset.i;
      if (cell.classList.contains("empty")) {
        sel = sel === i ? null : i;
        if (editing !== null) commitEdit();
        renderGrid(analyze()); applyFilter();
        const pick = grid.querySelector(".pick");
        if (pick) { pick.focus(); try { pick.showPicker(); } catch (err) { /* older browsers: the menu opens on the next click */ } }
        return;
      }
      if (editing === i) return;
      if (editing !== null) commitEdit();
      sel = i; startEdit(i);
      return;
    }
    if (sel !== null && !t.closest(".signups")) { sel = null; renderGrid(analyze()); applyFilter(); }
  });
  document.addEventListener("keydown", (e) => {
    const t = e.target;
    if (t.id === "name-input") {
      if (e.key === "Enter") { e.preventDefault(); sel = null; commitEdit(); }
      else if (e.key === "Escape") { e.preventDefault(); sel = null; commitEdit(false); }
      return;
    }
    if (t.classList && t.classList.contains("su-name")) {
      if (e.key === "Enter") { e.preventDefault(); if (t.closest(".su.new")) startJoin(); else t.blur(); }
      return;
    }
    if ((e.key === "Enter" || e.key === " ") && t.classList && t.classList.contains("cell")) { e.preventDefault(); t.click(); return; }
    if (e.key === "Escape") {
      if (dialogRoot.innerHTML) { if (!dialogRoot.querySelector(".overlay.locked")) closeDialog(); return; }
      sel = null; pinned = null; renderGrid(analyze()); renderBuffs(analyze()); applyFilter();
    }
  });
  document.addEventListener("input", (e) => { if (e.target.id === "name-input") draftName = e.target.value; });
  document.addEventListener("focusout", (e) => {
    if (e.target.id !== "name-input") return;
    // Let a click on a signup spec land first so it can fill the selected slot.
    setTimeout(() => { if (editing !== null && document.activeElement && document.activeElement.id !== "name-input") commitEdit(); }, 0);
  });

  // Picking a signup in an empty slot. While that menu is open, remote updates wait so it does not close under you.
  function picking() { const a = document.activeElement; return !!(a && a.classList && a.classList.contains("pick")); }
  grid.addEventListener("change", (e) => {
    if (!e.target.classList.contains("pick") || !e.target.value) return;
    const [id, key] = e.target.value.split("|");
    const u = state.signups.find((x) => x.id === id);
    if (u) placePlayer(key, u.n, +e.target.dataset.i);
  });
  grid.addEventListener("focusout", (e) => { if (e.target.classList.contains("pick")) setTimeout(applyDeferred, 0); });

  // Signups save on change: a name when you leave the box or press Enter, a spec as soon as you pick it.
  signups.addEventListener("change", (e) => {
    const row = e.target.closest(".su");
    if (!row) return;
    holdSignups = true; // focus may be moving to another field in this list; redraw once it lands
    saveSignup(row);
    if (e.target.tagName === "SELECT") e.target.blur();
    setTimeout(() => { holdSignups = false; if (signupsDirty) renderSignups(); }, 0);
  });
  signups.addEventListener("focusout", () => setTimeout(() => { if (signupsDirty) renderSignups(); }, 0));

  buffs.addEventListener("mouseover", (e) => { const b = e.target.closest(".brow"); const tag = b ? b.dataset.buff : null; if (tag !== hovered) { hovered = tag; applyFilter(); } });
  buffs.addEventListener("mouseleave", () => { hovered = null; applyFilter(); });

  // Drag and drop: signup specs onto slots or along their own row to reorder them, players between slots,
  // players off the raid to remove them.
  // Where a dragged spec would land among its own row's specs: {chip, after} or null.
  function reorderTarget(e) {
    if (!drag || drag.type !== "spec" || !adminOk) return null; // reordering specs changes the signup: admin only
    const chip = e.target.closest(".chip");
    if (!chip || chip.closest(".su").dataset.id !== drag.id || chip.dataset.spec === drag.key) return null;
    const r = chip.getBoundingClientRect();
    return { chip, after: e.clientX > r.left + r.width / 2 };
  }
  function clearReorderMarks() { signups.querySelectorAll(".ins-l, .ins-r, .dragging").forEach((el) => el.classList.remove("ins-l", "ins-r", "dragging")); }
  document.addEventListener("dragstart", (e) => {
    const spec = e.target.closest && e.target.closest(".chip");
    const cell = e.target.closest && e.target.closest(".cell.filled");
    if (spec) {
      const id = spec.closest(".su").dataset.id;
      drag = { type: "spec", key: spec.dataset.spec, id, n: (state.signups.find((u) => u.id === id) || { n: "" }).n };
      spec.classList.add("dragging");
    }
    else if (cell && editing === null) { drag = { type: "cell", i: +cell.dataset.i }; cell.classList.add("dragging"); }
    else return;
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", drag.type === "spec" ? drag.key : String(drag.i)); } catch (err) {}
  });
  document.addEventListener("dragover", (e) => {
    if (!drag) return;
    const ro = reorderTarget(e);
    signups.querySelectorAll(".ins-l, .ins-r").forEach((el) => { if (!ro || el !== ro.chip) el.classList.remove("ins-l", "ins-r"); });
    if (ro) {
      e.preventDefault();
      ro.chip.classList.toggle("ins-l", !ro.after);
      ro.chip.classList.toggle("ins-r", ro.after);
      return;
    }
    const cell = e.target.closest(".cell");
    const offRaid = drag.type === "cell" && e.target.closest(".signups, .buffs");
    if (!cell && !offRaid) return;
    e.preventDefault();
    grid.querySelectorAll(".drop").forEach((el) => { if (el !== cell) el.classList.remove("drop"); });
    if (cell) cell.classList.add("drop");
  });
  document.addEventListener("drop", (e) => {
    if (!drag) return;
    e.preventDefault();
    const ro = reorderTarget(e);
    const d = drag;
    drag = null;
    clearReorderMarks();
    if (ro) {
      const u = state.signups.find((x) => x.id === d.id);
      if (u) {
        const c = u.c.filter((k) => k !== d.key);
        c.splice(c.indexOf(ro.chip.dataset.spec) + (ro.after ? 1 : 0), 0, d.key);
        updateSignup(u.id, { ...u, c });
      }
      applyDeferred();
      return;
    }
    const cell = e.target.closest(".cell");
    if (cell) {
      const to = +cell.dataset.i;
      if (d.type === "spec") placePlayer(d.key, d.n, to);
      else if (d.i !== to) change((s) => { const x = s.slots[d.i]; s.slots[d.i] = s.slots[to]; s.slots[to] = x; });
      else renderAll();
    } else if (d.type === "cell" && e.target.closest(".signups, .buffs")) removeSlot(d.i);
    applyDeferred();
  });
  document.addEventListener("dragend", () => {
    drag = null;
    clearReorderMarks();
    grid.querySelectorAll(".drop, .dragging").forEach((el) => el.classList.remove("drop", "dragging"));
    applyDeferred();
  });

  renderAll();
  renderLaunch();
  setInterval(renderLaunch, 60 * 1000);
  showChangesNotice();
  readAuthHash();
  readAdminHash();
  fingerprintReady.then(checkAdmin); // so "already signed up" also counts the fingerprint
  poll();
})();
</script>
</body>
</html>
