<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Raid Comp · WoW Forever</title>
<meta name="description" content="Shared, live raid composition planner for World of Warcraft: Forever.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Open+Sans:wght@400;600;700&display=swap">
<!-- Vercel Web Analytics (visitors and page views). Vercel serves this script when Analytics is enabled for the project. -->
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
<style>
:root{
  /* Dark, quiet UI in the spirit of Wowhead: near-black surfaces, thin borders, gold accent, class colors carry the meaning. */
  --bg:#0e0e10;
  --panel:#161618;
  --panel-2:#1d1d20;
  --slot:#121214;
  --line:#2a2a2e;
  --line-2:#3a3a40;
  --accent:#f2b84b;
  --accent-ink:#1a1206;
  --text:#e8e8ea;
  --soft:#c4c4c9;
  --muted:#8d8d95;
  --faint:#55555c;
  --warn:#f2b84b;
  --bad:#e5564b;
  --ok:#4cc46b;
  --radius:8px;
  --font:"Open Sans",Arial,"Helvetica Neue",Helvetica,sans-serif;
  --narrow:"Open Sans",Arial,sans-serif;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Section titles: small uppercase labels, like Wowhead's navigation */
.ttl{display:flex;align-items:baseline;gap:8px;margin:0;font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#fff}
.ttl small{font-family:var(--font);font-size:11.5px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted)}
.ttl .count{font-family:var(--font);font-size:11px;font-weight:700;letter-spacing:0;padding:1px 7px;border-radius:10px;background:var(--panel-2);color:var(--soft)}

/* Top bar */
.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));background:rgba(14,14,16,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:30px;border-radius:6px;background:linear-gradient(135deg,#f2b84b,#b8741f);display:grid;place-items:center;color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:17px}
.brand h1{margin:0;font-family:var(--display);font-size:22px;line-height:1;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff}
.brand p{margin:2px 0 0;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.btn{height:32px;padding:0 14px;border:1px solid var(--line-2);border-radius:6px;background:var(--panel-2);font-weight:600;font-size:12px;white-space:nowrap;color:var(--soft);transition:border-color .12s,color .12s,background .12s}
.btn:hover{border-color:var(--muted);color:#fff}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#ffc65e;color:var(--accent-ink)}
.btn.armed{border-color:var(--bad);background:#2a1513;color:#ffb4ab}
.seg{display:inline-flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--line-2);border-radius:6px;background:var(--panel-2);height:32px}
.seg span{padding:0 6px 0 8px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg button{height:26px;padding:0 10px;border:0;border-radius:4px;background:none;font-weight:700;font-size:12px;color:var(--muted)}
.seg button:hover{color:#fff}
.seg button[aria-pressed="true"]{background:var(--line-2);color:#fff}
.live{display:inline-flex;align-items:center;gap:6px;min-width:110px;padding:0 6px;font-size:12px;font-weight:600;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.live.ok i{background:var(--ok);box-shadow:0 0 0 3px rgba(76,196,107,.18)}
.live.busy i{background:var(--accent)}
.live.bad i{background:var(--bad)}

/* Layout: signups take the left column; groups, suggestion, preferences and coverage stack on the right. */
.layout{display:grid;grid-template-columns:430px minmax(0,1fr);gap:16px;align-items:start;max-width:1520px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
.plan{display:grid;gap:16px;min-width:0}
@media (max-width:960px){.layout{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);min-width:0;padding:14px 16px 16px}
.phead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin:0 0 12px}
.banner{grid-column:1 / -1;padding:10px 14px;border:1px solid rgba(242,184,75,.5);background:#211a0c;color:#f6dca4;border-radius:var(--radius);font-size:12.5px}

.hint{margin:4px 0 12px;font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:12px}
.stats dt{color:var(--muted);text-align:right}
.stats dd{margin:0;color:var(--soft)}
.stats b{color:#fff;font-variant-numeric:tabular-nums}

/* Icons */
.ic{display:block;flex:none;background:var(--panel-2);border-radius:4px;object-fit:cover}
.ic.broken{opacity:0}

/* Groups: each group is a card, each slot a dark row tinted with the class color */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.group{padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2)}
.group h3{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 8px;font-family:var(--display);font-size:13.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.group h3 span{font-family:var(--font);font-size:11px;font-weight:600;letter-spacing:0;color:var(--muted)}
.cells{display:flex;flex-direction:column;gap:4px}
.cell{position:relative;display:flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 4px;border:1px solid transparent;border-radius:5px;background:var(--slot);cursor:pointer;transition:border-color .12s,opacity .12s,background .12s}
.cell.empty{border:1px dashed #45454c;background:rgba(255,255,255,.02)}
.cell.empty::after{content:"+";margin:auto;font-size:15px;font-weight:600;color:var(--faint);transition:color .12s}
.cell.empty:hover{border-color:var(--muted)}
.cell.empty:hover::after{content:"+ Add player";font-size:11.5px;color:var(--soft)}
.cell.empty.sel::after{content:none}
.cell.sel{border-color:var(--accent)!important;box-shadow:0 0 0 1px var(--accent)}
.cell.filled{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 20%,var(--slot)) 0%,var(--slot) 75%);box-shadow:inset 3px 0 0 var(--c)}
.cell.filled:hover{border-color:var(--line-2)}
.cell.filled .ic{width:28px;height:28px;margin-left:3px}
.cell .nm{flex:1;min-width:0;font-weight:700;font-size:13px;color:var(--cn,var(--c));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .nm.anon{font-weight:400;font-style:italic;color:var(--muted)}
.cell input{flex:1;min-width:0;height:26px;margin-right:22px;padding:0 8px;border:1px solid var(--line-2);border-radius:4px;background:#000;color:#fff;font-weight:700;font-size:13px}
.cell .x{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:22px;height:22px;padding:0;border:0;border-radius:4px;background:var(--panel-2);color:var(--soft);font-weight:700;font-size:13px;line-height:22px;opacity:0}
.cell .x:hover{background:var(--bad);color:#fff}
.cell:hover .x,.cell.editing .x,.cell:focus-within .x{opacity:1}
@media (hover:none){.cell .x{opacity:.9}}
.cell .pick{flex:1;min-width:0;height:28px;padding:0 6px;border:0;border-radius:4px;background:var(--panel-2);color:var(--text);font-weight:600;font-size:12px;cursor:pointer}
.cell .pick option,.cell .pick optgroup{background:var(--panel);color:var(--text)}
.cell.drop{outline:2px dashed var(--accent);outline-offset:1px}
.cell.dragging{opacity:.35}
.grid.filtering .cell.filled:not(.hl){opacity:.3}
.cell.hl{border-color:#fff}
/* A player's specs in preference order (best on the left), the one they are playing lit up. */
.prio{display:flex;flex:none;gap:3px}
.prio .ic{width:16px;height:16px;border-radius:3px;opacity:.3;filter:grayscale(.6)}
.prio .ic.cur{opacity:1;filter:none;box-shadow:0 0 0 1px #fff}
.cell.filled:hover .prio,.cell.filled:focus-within .prio{margin-right:24px}
.party{display:flex;flex-wrap:wrap;gap:4px;min-height:18px;margin:8px 2px 0}
.party .ic{width:18px;height:18px}
.foot{margin:12px 2px 0;font-size:11.5px;color:var(--faint)}

/* Signups */
.su{display:flex;align-items:center;gap:8px;min-height:40px;padding:4px 6px;border-radius:6px}
.su + .su{margin-top:2px}
.su:hover{background:var(--panel-2)}
.su.placed .su-name,.su.placed .su-specs{opacity:.55}
.su.placed:hover .su-name,.su.placed:hover .su-specs,.su.placed:focus-within .su-name,.su.placed:focus-within .su-specs{opacity:1}
.su-name{flex:0 0 122px;width:122px;height:30px;padding:0 8px;border:1px solid transparent;border-radius:5px;background:none;font-weight:700;font-size:13px;color:#fff}
.su-name:hover{border-color:var(--line-2)}
.su-name:focus{border-color:var(--accent);background:#000}
.su.new{margin-bottom:8px;padding:8px;border:1px dashed var(--line-2);background:var(--slot)}
.su.new .su-name{background:#000;border-color:var(--line-2)}
.su-specs{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.chip{position:relative;display:inline-flex;border-radius:5px;box-shadow:0 0 0 2px var(--c);cursor:grab}
.chip button{display:block;padding:0;border:0;background:none;border-radius:5px}
.chip .ic{width:22px;height:22px}
.chip .x{position:absolute;top:-8px;right:-8px;width:15px;height:15px;border:0;border-radius:50%;background:var(--bad);color:#fff;font-size:10px;font-weight:700;line-height:15px;opacity:0}
.chip:hover .x,.chip .x:focus-visible{opacity:1}
.chip.on{box-shadow:0 0 0 2px var(--c),0 0 0 4px #fff}
.signups.filtering .chip:not(.elig){opacity:.2}
.signups.filtering .chip.elig{box-shadow:0 0 0 2px var(--c),0 0 0 4px #fff}
.su-add{appearance:none;width:26px;height:26px;padding:0;border:1px dashed var(--line-2);border-radius:5px;background:none;color:var(--muted);font-weight:700;font-size:15px;text-align:center;text-align-last:center;cursor:pointer}
.su-add:hover{border-color:var(--accent);color:var(--accent)}
.su-add option,.su-add optgroup{background:var(--panel);color:var(--text);font-size:12px;text-align:left}
.su .where{flex:none;padding:1px 7px;border-radius:10px;background:var(--panel-2);font-size:11px;font-weight:700;color:var(--soft)}
.su .mini{flex:none;width:24px;height:24px;padding:0;border:0;border-radius:4px;background:none;color:var(--faint);font-weight:700;font-size:14px;opacity:0}
.su:hover .mini,.su .mini:focus-visible{opacity:1}
.su .mini:hover{color:#fff;background:var(--bad)}
@media (hover:none){.su .mini{opacity:1}}

/* Coverage */
.buffs-body{columns:220px;column-gap:28px}
.bsec{break-inside:avoid;padding-bottom:12px}
.bsec h4{margin:0 0 4px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bsec h4 small{font-weight:400;letter-spacing:0;text-transform:none;margin-left:4px}
.brow{display:flex;align-items:center;gap:8px;width:100%;padding:2px 6px;border:0;border-radius:4px;background:none;text-align:left;font-size:12px;color:var(--faint)}
.brow .ic{width:18px;height:18px;opacity:.35;filter:grayscale(1)}
.brow b{min-width:14px;text-align:right;font-variant-numeric:tabular-nums}
.brow.on{color:var(--soft)}
.brow.on b{color:var(--accent)}
.brow.on .ic{opacity:1;filter:none}
.brow:hover{background:var(--panel-2)}
.brow.pin{background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--accent)}
.notes{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:6px;break-inside:avoid}
.notes li{padding:8px 10px;border-radius:5px;border-left:3px solid var(--warn);background:#1f190d;font-size:12px;line-height:1.45;color:#f1dfb8}

/* Suggested comp */
.sg-sum{margin:0 0 10px;font-size:12px;color:var(--muted)}
.sg-sum b{color:#fff}
.needs{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 14px;padding:0;list-style:none}
.needs li{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px 0 3px;border-radius:13px;background:var(--panel-2);font-size:11.5px;font-weight:600;color:var(--soft)}
.needs li .ic{width:20px;height:20px;border-radius:50%}
.needs li.ok{box-shadow:inset 0 0 0 1px rgba(76,196,107,.45);color:#bfe8c9}
.needs li.miss{box-shadow:inset 0 0 0 1px rgba(229,86,75,.6);color:#ffb4ab}
.needs li.none{box-shadow:inset 0 0 0 1px var(--line-2);color:var(--muted)}
.needs li.bare{padding:0 3px;box-shadow:none;background:none}
.needs li.bare .ic{box-shadow:0 0 0 1px rgba(76,196,107,.5)}
.needs .sep{width:1px;height:18px;margin:0 4px;padding:0;background:var(--line-2);border-radius:0}
.sg-cell{display:flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 4px;border-radius:5px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 20%,var(--slot)) 0%,var(--slot) 75%);box-shadow:inset 3px 0 0 var(--c)}
.sg-cell .ic{width:28px;height:28px;margin-left:3px}
.sg-cell .nm{flex:1;min-width:0;font-weight:700;font-size:13px;color:var(--cn,var(--c));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg-cell.empty{background:rgba(255,255,255,.02);box-shadow:none;border:1px dashed #3a3a40}
.rk{flex:none;padding:1px 7px;border-radius:10px;background:var(--panel-2);font-size:10.5px;font-weight:700}
.rk.r1{color:var(--ok);background:rgba(76,196,107,.12)}
.rk.r2{color:var(--warn);background:rgba(242,184,75,.12)}
.rk.r3{color:#f08a4b;background:rgba(240,138,75,.12)}
.bench{margin:12px 2px 0;font-size:12px;color:var(--muted)}

/* Preferences */
.prefs-wrap{overflow-x:auto;margin:0 -4px}
.prefs table{border-collapse:separate;border-spacing:4px 0;width:100%;font-size:12px}
.prefs th{padding:0 4px 6px;text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.prefs td{padding:4px 0;border-top:1px solid var(--line);vertical-align:middle}
.prefs td.who{padding-left:4px;padding-right:8px;font-weight:700;font-size:13px;white-space:nowrap;color:#fff}
.pref{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px 0 3px;border-radius:5px;background:var(--slot);box-shadow:inset 3px 0 0 var(--c);white-space:nowrap;font-weight:600;font-size:12px;color:var(--soft)}
.pref .ic{width:24px;height:24px;margin-left:3px}
.pref.sug{background:rgba(76,196,107,.1);box-shadow:inset 3px 0 0 var(--c),inset 0 0 0 1px rgba(76,196,107,.6);color:#fff}
.pref.cur{outline:2px solid #fff;outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0 0 10px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-2px;border-radius:3px;background:var(--slot)}
.legend .l-sug{box-shadow:inset 0 0 0 1px rgba(76,196,107,.8);background:rgba(76,196,107,.15)}
.legend .l-cur{outline:2px solid #fff}

/* Copy dialog and toast */
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.7)}
.dialog{width:min(560px,100%);padding:16px;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--radius)}
.dialog h3{margin:0 0 10px;font-size:14px;color:#fff}
.dialog textarea{width:100%;height:240px;padding:10px;background:#000;color:var(--text);border:1px solid var(--line-2);border-radius:5px;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace}
.dialog .row{display:flex;justify-content:flex-end;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;max-width:calc(100% - 32px);padding:9px 16px;background:var(--text);color:#000;font-weight:600;font-size:12px;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:520px){
  .su{flex-wrap:wrap}
  .su-name{flex:1 1 140px}
  .grid{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true">R</span><div><h1>Raid Comp</h1><p>World of Warcraft: Forever</p></div></div>
  <div class="tools" id="tools"></div>
</header>
<main class="layout">
  <div class="banner" id="banner" hidden></div>
  <section class="panel signups" id="signups" aria-label="Signups"></section>
  <div class="plan">
    <section class="panel groups" aria-label="Raid groups">
      <div class="phead"><h2 class="ttl">Raid groups <small>click a slot to fill it, drag to move</small></h2></div>
      <div class="grid" id="grid"></div>
      <p class="foot">Everyone with this link edits the same raid. Changes show up for the others within a couple of seconds.</p>
    </section>
    <section class="panel suggest" id="suggest" aria-label="Suggested comp"></section>
    <section class="panel prefs" id="prefs" aria-label="Preferences"></section>
    <section class="panel buffs" id="buffs" aria-label="Raid coverage"></section>
  </div>
</main>
<div id="dialog-root"></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
(() => {
  "use strict";
  const API = "/api/comp";
  const ICON = (name) => "https://wow.zamimg.com/images/wow/icons/medium/" + name + ".jpg";
  const MAX = 40;
  const SIZES = [10, 20, 40];
  const NAME_MAX = 20;
  const FULL = "The raid is full. Remove someone or switch to a bigger size.";
  const MAX_CLASSES = 3; // per signup; any number of specs within those classes
  const POLL_MS = 1500;
  const PETS_KEY = "raidcomp-hunter-pets";

  /* ---------- Game data (WoW Forever) ---------- */
  const CLASS = {
    druid: { name: "Druid", color: "#FF7C0A" },
    hunter: { name: "Hunter", color: "#AAD372" },
    mage: { name: "Mage", color: "#3FC7EB" },
    paladin: { name: "Paladin", color: "#F48CBA" },
    priest: { name: "Priest", color: "#FFFFFF" },
    rogue: { name: "Rogue", color: "#FFF468" },
    shaman: { name: "Shaman", color: "#0070DD", text: "#3d9bff" }, // text: lighter for names on the dark slots
    warlock: { name: "Warlock", color: "#8788EE" },
    warrior: { name: "Warrior", color: "#C69B6D" }
  };
  const DRUID = ["motw", "innervate", "armor2", "brez", "dcurse", "dpoison"];
  const HUNTER = ["hit", "natureres", "frenzy"], PET = ["ap", "tongues", "mortal"];
  const MAGE = ["int", "amp", "dcurse"];
  const PALADIN = ["kings", "wisdom", "light", "aura", "might", "salv", "jol", "jow", "resaura", "dmagic", "ddisease", "dpoison"];
  const PRIEST = ["stam", "shadowres", "spirit", "purge", "dmagic", "ddisease"];
  const ROGUE = ["armor1", "mortal", "tongues"];
  const SHAMAN = ["wf", "goa", "ft", "soe", "mst", "hst", "ground", "tremor", "restotem", "purge", "ddisease", "dpoison"];
  const WARLOCK = ["bp", "coe", "armor2", "tongues", "brez", "purge", "dmagic"];
  const WARRIOR = ["ap", "armor1", "demo", "clap"];
  // key, class, spec, role, armor, tier token, icon, tags, hunter-pet tags
  const SPEC_ROWS = [
    ["druid_balance", "druid", "Balance", "range", "leather_int", "vanquisher", "spell_nature_starfall", DRUID.concat("scrit", "hit")],

  const PREF_COST = (r) => 13 * r - r * r; // 1st 0, 2nd 12, 3rd 22, 4th 30, 5th 36

  let suggestMemo = { key: "", out: null };
  function suggest() {

  // Spread players over groups of five: tanks and melee with shamans and paladins, casters together,

  function arrange(raid, size) {
    const G = Math.min(size / 5, Math.max(1, Math.ceil(raid.length / 5)));
    const groups = Array.from({ length: G }, () => []);
    const phys = (sp) => sp.role === "tank" || sp.role === "melee" || sp.cls === "hunter";
    const caster = (sp) => sp.role === "range" && sp.cls !== "hunter";
    const order = (m) => { const sp = SPEC[m.s]; return sp.role === "tank" ? 0 : sp.cls === "shaman" || sp.cls === "paladin" ? 1 : sp.role === "heal" ? 4 : phys(sp) ? 2 : 3; };
    raid.slice().sort((a, b) => order(a) - order(b)).forEach((m) => {
      const sp = SPEC[m.s];
      let bestG = 0, bestV = -Infinity;

        if (sp.cls === "warlock") v -= 4 * count((x) => x.cls === "warlock");
        if (v > bestV) { bestV = v; bestG = gi; }

      groups[bestG].push(m);
    });

    groups.forEach((g, gi) => g.forEach((m, k) => { slots[gi * 5 + k] = m; }));

  function renderGrid(a) {

  // Specs a signup can still add: any class while they have fewer than MAX_CLASSES, then only their own classes.
  function specOptions(c) {
    const own = new Set(c.map((k) => SPEC[k].cls));
    return Object.keys(CLASS).filter((cls) => own.has(cls) || own.size < MAX_CLASSES).map((cls) => {
      const opts = SPEC_ROWS.filter((r) => r[1] === cls && !c.includes(r[0])).map((r) => '<option value="' + r[0] + '">' + esc(r[2] + " " + CLASS[cls].name) + "</option>").join("");
      return opts && '<optgroup label="' + CLASS[cls].name + '">' + opts + "</optgroup>";

  }
  // placed: lower-case name -> raid slot, so a signup shows where that player already is.
  function signupRow(u, placed) {
    const who = u.n || "this player", i = u.n ? placed.get(u.n.toLowerCase()) : undefined;
    const m = i != null ? state.slots[i] : null, g = Math.floor(i / 5) + 1;
    const chips = u.c.map((k) => {
      const sp = SPEC[k], c = CLASS[sp.cls], full = specName(sp);

    }).join("");

    return '<div class="su' + (u.id ? "" : " new") + (m ? " placed" : "") + '" data-id="' + esc(u.id) + '">' +
      '<input class="su-name" maxlength="' + NAME_MAX + '" autocomplete="off" spellcheck="false" placeholder="' + (u.id ? "Name" : "Your name") + '" aria-label="Name" value="' + esc(u.n) + '">' +
      '<span class="su-specs">' + chips + (opts ? '<select class="su-add" title="Add a spec" aria-label="Add a spec for ' + esc(who) + '"><option value="">+</option>' + opts + "</select>" : "") + "</span>" +

  let signupsDirty = false, holdSignups = false;
  function renderSignups() {

    signups.innerHTML = '<div class="phead"><h2 class="ttl">Signups <span class="count">' + state.signups.length + "</span></h2></div>" +
      '<p class="hint">Add your name, then your specs with + (up to ' + MAX_CLASSES + " classes, best first). Click a spec to place that player, or drag it onto a slot.</p>" +
      signupRow({ id: "", n: "", c: [] }, placed) + newestFirst().map((u) => signupRow(u, placed)).join("");

  function renderBuffs(a) {
    let h = '<section class="bsec"><h4>Composition</h4><dl class="stats">' + statsHTML(a) + "</dl></section>";
    BUFFS.forEach(([sec, party, rows]) => {
      h += '<section class="bsec"><h4>' + sec + (party ? "<small>per group</small>" : "") + "</h4>" + rows.map(([tag, label, icon, src]) => {
        const n = a.tags[tag] || 0;
        return '<button type="button" class="brow' + (n ? " on" : "") + (pinned === tag ? " pin" : "") + '" data-buff="' + tag + '" title="' + esc(src) + '">' + img(icon) + "<b>" + n + "</b><span>" + esc(label) + "</span></button>";
      }).join("") + "</section>";
    });

  }

  function rankBadge(rank) {
    return '<span class="rk r' + Math.min(rank + 1, 3) + '" title="' + ordinal(rank + 1) + ' choice">' + ordinal(rank + 1) + "</span>";
  }
  function renderSuggest() {
    const sg = suggest(), raid = sg.raid, t = sg.t;
    if (!raid.length) {
      suggestEl.innerHTML = '<div class="phead"><h2 class="ttl">Suggested comp</h2></div><p class="hint">Once people sign up with their specs, the best comp for them shows here.</p>';
      return;
    }
    const specs = raid.map((m) => SPEC[m.s]), tags = new Set(specs.flatMap(specTags));
    const count = (f) => specs.filter(f).length;
    const canBring = (f) => [...signupsByName().values()].some((u) => u.c.some((k) => f(SPEC[k])));
    // Counts always show with their label; buffs show a label only when missing, an icon when covered.
    let missing = "", covered = "";
    const need = (ok, possible, icon, label, title, always) => {
      const tip = esc(title + (ok ? "" : possible ? ". Missing." : ". Nobody signed up can bring it."));
      const bare = ok && !always;
      const h = '<li class="' + (ok ? "ok" : possible ? "miss" : "miss none") + (bare ? " bare" : "") + '" title="' + tip + '">' + img(icon) + (bare ? "" : esc(label)) + "</li>";
      if (always) missing += h; else if (ok) covered += h; else missing += h;
    };
    const tanks = count((sp) => sp.role === "tank"), heals = count((sp) => sp.role === "heal"), pals = count((sp) => sp.cls === "paladin");
    need(tanks >= t.tank, canBring((sp) => sp.role === "tank"), "ability_warrior_defensivestance", "Tanks " + tanks + "/" + t.tank, "Tanks", true);
    need(heals >= t.heal, canBring((sp) => sp.role === "heal"), "spell_holy_flashheal", "Healers " + heals + "/" + t.heal, "About one healer per 3–4 players", true);
    need(pals >= t.paladin, canBring((sp) => sp.cls === "paladin"), "spell_magic_greaterblessingofkings", "Paladins " + pals + "/" + t.paladin, "Each paladin gives one blessing (Kings, Wisdom, Might, Salvation, Light)", true);
    BLESSINGS.concat(NEEDS).forEach(([tag], i) => {
      const b = BUFF[tag], ok = i < BLESSINGS.length ? i < pals : tags.has(tag);
      const possible = i < BLESSINGS.length ? canBring((sp) => sp.cls === "paladin") : canBring((sp) => specTags(sp).includes(tag));
      need(ok, possible, b.icon, b.label, b.label + " · " + b.src);
    });
    const needs = missing + (covered ? '<li class="sep" aria-hidden="true"></li>' + covered : "");
    const ranks = {};
    raid.forEach((m) => { ranks[m.rank] = (ranks[m.rank] || 0) + 1; });
    const rankSum = Object.keys(ranks).sort((a, b) => a - b).map((r) => "<b>" + ranks[r] + "</b> on " + ordinal(+r + 1) + " choice").join(", ");
    let groupsH = "";
    for (let g = 0; g * 5 < raid.length || g === 0; g++) {
      let cells = "";
      for (let i = g * 5; i < g * 5 + 5; i++) {
        const m = sg.slots[i];
        if (!m) { cells += '<div class="sg-cell empty"></div>'; continue; }
        const sp = SPEC[m.s], c = CLASS[sp.cls];
        cells += '<div class="sg-cell" style="--c:' + c.color + ";--cn:" + (c.text || c.color) + '" title="' + esc(m.n + ": " + specName(sp) + " (" + ordinal(m.rank + 1) + " choice)") + '">' + img(sp.icon) + '<span class="nm">' + esc(m.n) + "</span>" + rankBadge(m.rank) + "</div>";
      }
      groupsH += '<section class="group"><h3>Group ' + (g + 1) + "<span>" + sg.slots.slice(g * 5, g * 5 + 5).filter(Boolean).length + "/5</span></h3>" + '<div class="cells">' + cells + "</div></section>";
    }
    suggestEl.innerHTML = '<div class="phead"><h2 class="ttl">Suggested comp <small>best fit for the signups, updates as they change</small></h2>' +
      '<button type="button" class="btn ' + (useArmed ? "armed" : "primary") + '" data-act="use-suggest">' + (useArmed ? "Click again to replace the groups" : "Use this comp") + "</button></div>" +
      '<p class="sg-sum"><b>' + raid.length + "</b> players: " + rankSum + ".</p>" +
      '<ul class="needs">' + needs + "</ul>" +
      '<div class="grid">' + groupsH + "</div>" +
      (sg.bench.length ? '<p class="bench">Bench (raid is full): ' + sg.bench.map((u) => esc(u.n)).join(", ") + "</p>" : "");
  }
  function renderPrefs() {
    const players = [...signupsByName().values()];
    if (!players.length) { prefsEl.innerHTML = ""; prefsEl.hidden = true; return; }
    prefsEl.hidden = false;
    const sg = suggest(), sugBy = new Map(sg.raid.map((m) => [m.n.toLowerCase(), m.s]));
    const curBy = new Map(state.slots.filter((m) => m && m.n).map((m) => [m.n.toLowerCase(), m.s]));
    const cols = Math.max(...players.map((u) => u.c.length));
    let head = "<tr><th>Player</th>";
    for (let r = 0; r < cols; r++) head += "<th>" + ordinal(r + 1) + "</th>";
    const rows = players.map((u) => {
      const key = u.n.toLowerCase();
      let tds = "";
      for (let r = 0; r < cols; r++) {
        const k = u.c[r];
        if (!k) { tds += "<td></td>"; continue; }
        const sp = SPEC[k], isSug = sugBy.get(key) === k, isCur = curBy.get(key) === k;
        tds += '<td><span class="pref' + (isSug ? " sug" : "") + (isCur ? " cur" : "") + '" style="--c:' + CLASS[sp.cls].color + '" title="' + esc(ordinal(r + 1) + " choice: " + specName(sp) + (isSug ? ". Suggested." : "") + (isCur ? ". Playing this in the raid now." : "")) + '">' + img(sp.icon) + esc(sp.label + " " + CLASS[sp.cls].name) + "</span></td>";
      }
      return '<tr><td class="who">' + esc(u.n) + "</td>" + tds + "</tr>";
    }).join("");
    prefsEl.innerHTML = '<div class="phead"><h2 class="ttl">Preferences <small>left to right: what each player wants most</small></h2></div>' +
      '<p class="legend"><span><i class="l-sug"></i>Suggested comp</span><span><i class="l-cur"></i>In the raid groups now</span></p>' +
      '<div class="prefs-wrap"><table><thead>' + head + "</tr></thead><tbody>" + rows + "</tbody></table></div>";
  }

  function applyFilter() {
    const tag = hovered || pinned;
    signups.classList.toggle("filtering", !!tag);
    signups.querySelectorAll(".chip").forEach((el) => {
      el.classList.toggle("elig", !!tag && specTags(SPEC[el.dataset.spec]).includes(tag));
    });
    let any = false;
    grid.querySelectorAll(".cell").forEach((el) => {
      const m = state.slots[+el.dataset.i];
      const on = !!tag && !!m && specTags(SPEC[m.s]).includes(tag);
      if (on) any = true;
      el.classList.toggle("hl", on);
    });
    grid.classList.toggle("filtering", any);
  }

  function renderBanner() {
    if (net === "nostore") {
      banner.hidden = false;
      banner.textContent = "This site isn't connected to a database yet. In Vercel, open the project, go to Storage, add Upstash for Redis and connect it to this project, then redeploy.";
    } else banner.hidden = true;
  }

  function renderAll() {
    const a = analyze();
    renderTools(); renderBanner(); renderGrid(a); renderSignups(); renderSuggest(); renderPrefs(); renderBuffs(a); applyFilter();
  }

  /* ---------- Sync ---------- */
  function diff(before, after) {
    const ch = { slots: {} };
    let any = false;
    for (let i = 0; i < MAX; i++) {
      if (!same(before.slots[i], after.slots[i])) { ch.slots[i] = after.slots[i] ? { s: after.slots[i].s, n: after.slots[i].n } : null; any = true; }
    }
    if (before.size !== after.size) { ch.size = after.size; any = true; }
    const su = {};
    new Set(before.signups.concat(after.signups).map((u) => u.id)).forEach((id) => {
      const b = before.signups.find((u) => u.id === id), a = after.signups.find((u) => u.id === id);
      if (JSON.stringify(b) !== JSON.stringify(a)) su[id] = a ? { n: a.n, c: a.c } : null;
    });
    if (Object.keys(su).length) { ch.signups = su; any = true; }
    return any ? ch : null;
  }
  function merge(into, ch) {
    Object.keys(ch.slots).forEach((k) => { into.slots[k] = ch.slots[k]; });
    if ("size" in ch) into.size = ch.size;
    if (ch.signups) into.signups = Object.assign(into.signups || {}, ch.signups);
    return into;
  }
  function change(fn) {
    if (!loaded) { toast("Still connecting to the raid…"); return; }
    const before = { size: state.size, slots: state.slots.slice(), signups: state.signups };
    fn(state);
    const ch = diff(before, state);
    if (ch) { pending = merge(pending || { slots: {} }, ch); flush(); }
    renderAll();
  }
  function readJSON(r) {
    return r.json().catch(() => ({})).then((j) => {
      if (!r.ok) { const e = new Error(j.message || "Request failed"); e.status = r.status; throw e; }
      return j;
    });
  }
  function flush() {
    if (inFlight || !pending) return;
    const body = pending;
    pending = null;
    inFlight = true;
    renderTools();
    fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(readJSON)
      .then((s) => {
        inFlight = false; failures = 0; net = "ok";
        if (pending) flush(); else accept(s, true);
        renderTools(); renderBanner();
      }, (err) => {
        inFlight = false;
        if (err.status === 400) { toast("The server rejected that change: " + err.message); poll(); return; }
        pending = pending ? merge(body, pending) : body;
        failures++;
        net = err.status === 503 ? "nostore" : "offline";
        renderTools(); renderBanner();
        setTimeout(flush, Math.min(15000, 1000 * 2 ** failures));
      });
  }
  function accept(s, fromWrite) {
    if (!s || typeof s.v !== "number") return;
    if (inFlight || pending) return;
    if (s.v < serverV) return;
    if (s.v === serverV && loaded && !fromWrite) return;
    if (editing !== null || drag || picking()) { deferred = s; return; }
    deferred = null;
    serverV = s.v;
    const next = normalize(s);
    const changed = !loaded || next.size !== state.size || next.slots.some((m, i) => !same(m, state.slots[i])) || JSON.stringify(next.signups) !== JSON.stringify(state.signups);
    state = next;
    loaded = true;
    if (changed) renderAll();
  }
  function applyDeferred() {
    if (deferred && editing === null && !drag && !picking()) { const d = deferred; deferred = null; accept(d, true); }
  }
  function poll() {
    clearTimeout(pollTimer);
    if (document.hidden) return;
    fetch(API).then(readJSON).then((s) => {
      failures = 0;
      if (net !== "ok") { net = "ok"; renderBanner(); }
      accept(s, false);
      renderTools();
      pollTimer = setTimeout(poll, POLL_MS);
    }, (err) => {
      failures++;
      net = err.status === 503 ? "nostore" : "offline";
      if (net === "nostore" && !loaded) { loaded = false; }
      renderTools(); renderBanner();
      pollTimer = setTimeout(poll, Math.min(15000, POLL_MS * 2 ** Math.min(failures, 4)));
    });
  }
  document.addEventListener("visibilitychange", () => { if (document.hidden) clearTimeout(pollTimer); else poll(); });

  /* ---------- Actions ---------- */
  function startEdit(i) {
    editing = i;
    draftName = state.slots[i] ? state.slots[i].n : "";
    renderGrid(analyze()); applyFilter();
  }
  function commitEdit(keep) {
    if (editing === null) return;
    const i = editing, m = state.slots[i];
    editing = null;
    const nm = cleanName(draftName);
    if (keep !== false && m && nm !== m.n) change((s) => { s.slots[i] = { s: m.s, n: nm }; });
    else renderAll();
    applyDeferred();
  }
  // A named player is in the raid at most once: placing them again moves them, or switches their spec in place.
  function placePlayer(key, n, target) {
    const at = n ? state.slots.findIndex((m) => m && m.n.toLowerCase() === n.toLowerCase()) : -1;
    const i = target != null ? target : sel != null ? sel : at >= 0 && at < state.size ? at : firstEmpty();
    if (i == null) { toast(FULL); return; }
    if (i >= state.size) return;
    sel = null;
    change((s) => { if (at >= 0 && at !== i) s.slots[at] = null; s.slots[i] = { s: key, n }; });
  }
  function removeSlot(i) {
    if (editing === i) editing = null;
    if (sel === i) sel = null;
    change((s) => { s.slots[i] = null; });
  }
  function saveSignup(row) {
    const n = cleanName(row.querySelector(".su-name").value), add = row.querySelector(".su-add").value;
    let id = row.dataset.id;
    const cur = state.signups.find((u) => u.id === id);
    const c = (cur ? cur.c : []).concat(add && !(cur && cur.c.includes(add)) ? [add] : []);
    if (!id) {
      if (!n && !c.length) return;
      id = row.dataset.id = newId(); // later edits in this row, before it redraws, go to the same signup
    }
    updateSignup(id, n || c.length ? { id, n, c } : null);
  }
  function updateSignup(id, u) {
    change((s) => {
      const rest = s.signups.filter((x) => x.id !== id);
      s.signups = u ? rest.concat(u).sort((a, b) => (a.id < b.id ? -1 : 1)) : rest;
    });
  }
  function signupAction(act, id, key) {
    const u = state.signups.find((x) => x.id === id);
    if (!u) return;
    if (act === "su-del") updateSignup(id, null);
    else if (act === "su-drop") updateSignup(id, u.n || u.c.length > 1 ? { ...u, c: u.c.filter((k) => k !== key) } : null);
    else if (act === "su-place") placePlayer(key, u.n);
  }
  function rosterText() {
    const a = analyze(), lines = ["Raid comp: " + a.players + "/" + state.size + " players (" + a.roles.tank + " tank, " + a.roles.heal + " heal, " + a.roles.melee + " melee, " + a.roles.range + " range)", ""];
    for (let g = 0; g < state.size / 5; g++) {
      const mem = state.slots.slice(g * 5, g * 5 + 5).filter(Boolean).map((m) => (m.n || "?") + " (" + specName(SPEC[m.s]) + ")");
      lines.push("Group " + (g + 1) + ": " + (mem.length ? mem.join(", ") : "empty"));
    }
    const missing = BUFFS.filter((b) => !b[1]).flatMap((b) => b[2]).filter((r) => !a.tags[r[0]]).map((r) => r[1]);
    if (missing.length) lines.push("", "Missing: " + missing.join(", "));
    return lines.join("\n");
  }
  function showCopyDialog(text) {
    dialogRoot.innerHTML = '<div class="overlay" data-act="close-dialog"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="copy-title"><h3 id="copy-title">Copy this roster</h3><textarea id="copy-text" readonly aria-label="Roster text">' + esc(text) + '</textarea><div class="row"><button type="button" class="btn" data-act="close-dialog">Done</button></div></div></div>';
    const ta = $("#copy-text"); ta.focus(); ta.select();
  }
  let toastTimer = null;
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
  }

  /* ---------- Events ---------- */
  document.addEventListener("click", (e) => {
    const t = e.target;
    if (t.closest && t.closest(".overlay") && (t.classList.contains("overlay") || t.dataset.act === "close-dialog")) { dialogRoot.innerHTML = ""; return; }
    const sizeBtn = t.closest("[data-size]");
    if (sizeBtn) { const z = +sizeBtn.dataset.size; if (z !== state.size) { sel = null; change((s) => { s.size = z; }); } return; }
    const act = t.closest("[data-act]");
    if (act) {
      const a = act.dataset.act;
      if (a.startsWith("su-")) { signupAction(a, act.closest(".su").dataset.id, act.dataset.spec); return; }
      if (a === "remove") { removeSlot(+act.closest(".cell").dataset.i); return; }
      if (a === "pets") {
        pets = !pets;
        try { localStorage.setItem(PETS_KEY, pets ? "on" : "off"); } catch (err) {}
        renderAll(); return;
      }
      if (a === "copy") {
        const text = rosterText();
        try { navigator.clipboard.writeText(text).then(() => toast("Roster copied"), () => showCopyDialog(text)); }
        catch (err) { showCopyDialog(text); }
        return;
      }
      if (a === "clear") {
        if (!clearArmed) { clearArmed = setTimeout(() => { clearArmed = 0; renderTools(); }, 4000); renderTools(); return; }
        clearTimeout(clearArmed); clearArmed = 0; sel = null; editing = null;
        change((s) => { for (let i = 0; i < MAX; i++) s.slots[i] = null; });
        return;
      }
      if (a === "use-suggest") {
        if (!useArmed) { useArmed = setTimeout(() => { useArmed = 0; renderSuggest(); }, 4000); renderSuggest(); return; }
        clearTimeout(useArmed); useArmed = 0; sel = null; editing = null;
        const slots = suggest().slots;
        change((s) => { for (let i = 0; i < MAX; i++) s.slots[i] = slots[i] ? { s: slots[i].s, n: slots[i].n } : null; });
        toast("Groups replaced with the suggested comp");
        return;
      }
    }
    const brow = t.closest(".brow");
    if (brow) { pinned = pinned === brow.dataset.buff ? null : brow.dataset.buff; renderBuffs(analyze()); applyFilter(); return; }
    const cell = t.closest(".cell");
    if (cell) {
      if (t.tagName === "INPUT" || t.tagName === "SELECT" || t.tagName === "OPTION") return;
      const i = +cell.dataset.i;
      if (cell.classList.contains("empty")) {
        sel = sel === i ? null : i;
        if (editing !== null) commitEdit();
        renderGrid(analyze()); applyFilter();
        const pick = grid.querySelector(".pick");
        if (pick) { pick.focus(); try { pick.showPicker(); } catch (err) { /* older browsers: the menu opens on the next click */ } }
        return;
      }
      if (editing === i) return;
      if (editing !== null) commitEdit();
      sel = i; startEdit(i);
      return;
    }
    if (sel !== null && !t.closest(".signups")) { sel = null; renderGrid(analyze()); applyFilter(); }
  });
  document.addEventListener("keydown", (e) => {
    const t = e.target;
    if (t.id === "name-input") {
      if (e.key === "Enter") { e.preventDefault(); sel = null; commitEdit(); }
      else if (e.key === "Escape") { e.preventDefault(); sel = null; commitEdit(false); }
      return;
    }
    if (t.classList && t.classList.contains("su-name")) { if (e.key === "Enter") t.blur(); return; }
    if ((e.key === "Enter" || e.key === " ") && t.classList && t.classList.contains("cell")) { e.preventDefault(); t.click(); return; }
    if (e.key === "Escape") {
      if (dialogRoot.innerHTML) { dialogRoot.innerHTML = ""; return; }
      sel = null; pinned = null; renderGrid(analyze()); renderBuffs(analyze()); applyFilter();
    }
  });
  document.addEventListener("input", (e) => { if (e.target.id === "name-input") draftName = e.target.value; });
  document.addEventListener("focusout", (e) => {
    if (e.target.id !== "name-input") return;
    // Let a click on a signup spec land first so it can fill the selected slot.
    setTimeout(() => { if (editing !== null && document.activeElement && document.activeElement.id !== "name-input") commitEdit(); }, 0);
  });

  // Picking a signup in an empty slot. While that menu is open, remote updates wait so it does not close under you.
  function picking() { const a = document.activeElement; return !!(a && a.classList && a.classList.contains("pick")); }
  grid.addEventListener("change", (e) => {
    if (!e.target.classList.contains("pick") || !e.target.value) return;
    const [id, key] = e.target.value.split("|");
    const u = state.signups.find((x) => x.id === id);
    if (u) placePlayer(key, u.n, +e.target.dataset.i);
  });
  grid.addEventListener("focusout", (e) => { if (e.target.classList.contains("pick")) setTimeout(applyDeferred, 0); });

  // Signups save on change: a name when you leave the box or press Enter, a spec as soon as you pick it.
  signups.addEventListener("change", (e) => {
    const row = e.target.closest(".su");
    if (!row) return;
    holdSignups = true; // focus may be moving to another field in this list; redraw once it lands
    saveSignup(row);
    if (e.target.tagName === "SELECT") e.target.blur();
    setTimeout(() => { holdSignups = false; if (signupsDirty) renderSignups(); }, 0);
  });
  signups.addEventListener("focusout", () => setTimeout(() => { if (signupsDirty) renderSignups(); }, 0));

  buffs.addEventListener("mouseover", (e) => { const b = e.target.closest(".brow"); const tag = b ? b.dataset.buff : null; if (tag !== hovered) { hovered = tag; applyFilter(); } });
  buffs.addEventListener("mouseleave", () => { hovered = null; applyFilter(); });

  // Drag and drop: signup specs onto slots, players between slots, players off the raid to remove them.
  document.addEventListener("dragstart", (e) => {
    const spec = e.target.closest && e.target.closest(".chip");
    const cell = e.target.closest && e.target.closest(".cell.filled");
    if (spec) drag = { type: "spec", key: spec.dataset.spec, n: (state.signups.find((u) => u.id === spec.closest(".su").dataset.id) || { n: "" }).n };
    else if (cell && editing === null) { drag = { type: "cell", i: +cell.dataset.i }; cell.classList.add("dragging"); }
    else return;
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", drag.type === "spec" ? drag.key : String(drag.i)); } catch (err) {}
  });
  document.addEventListener("dragover", (e) => {
    if (!drag) return;
    const cell = e.target.closest(".cell");
    const offRaid = drag.type === "cell" && e.target.closest(".signups, .buffs");
    if (!cell && !offRaid) return;
    e.preventDefault();
    grid.querySelectorAll(".drop").forEach((el) => { if (el !== cell) el.classList.remove("drop"); });
    if (cell) cell.classList.add("drop");
  });
  document.addEventListener("drop", (e) => {
    if (!drag) return;
    e.preventDefault();
    const d = drag;
    drag = null;
    const cell = e.target.closest(".cell");
    if (cell) {
      const to = +cell.dataset.i;
      if (d.type === "spec") placePlayer(d.key, d.n, to);
      else if (d.i !== to) change((s) => { const x = s.slots[d.i]; s.slots[d.i] = s.slots[to]; s.slots[to] = x; });
      else renderAll();
    } else if (d.type === "cell" && e.target.closest(".signups, .buffs")) removeSlot(d.i);
    applyDeferred();
  });
  document.addEventListener("dragend", () => {
    drag = null;
    grid.querySelectorAll(".drop, .dragging").forEach((el) => el.classList.remove("drop", "dragging"));
    applyDeferred();
  });

  renderAll();
  poll();
})();
</script>
</body>
</html>
