<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Raid Comp · WoW Forever</title>
<meta name="description" content="Shared, live raid composition planner for World of Warcraft: Forever.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&display=swap">
<style>
:root{
  /* Signups | raid groups, with buff coverage across the bottom. Dark, steel-blue game UI. */
  --bg:#06080c;
  --panel:#0d1118;
  --panel-2:#151b26;
  --line:#2a3f52;
  --line-2:#4d7697;
  --accent:#78b2e0;
  --text:#e9edf2;
  --muted:#8a95a5;
  --faint:#4b5666;
  --warn:#e5b14f;
  --bad:#e05a4e;
  --ok:#4fc46f;
  --font:Verdana,Geneva,Tahoma,"DejaVu Sans",sans-serif;
  --narrow:"Roboto Condensed","Arial Narrow",Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;line-height:1.3}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* Top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px;padding:10px max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));background:var(--panel);border-bottom:1px solid var(--line)}
.brand h1{margin:0;font-size:24px;line-height:1;color:var(--accent);font-weight:700;letter-spacing:.2px}
.brand p{margin:3px 0 0;font-size:12px;font-weight:700;color:var(--accent);opacity:.75}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.btn{height:30px;padding:0 12px;border:2px solid var(--line-2);border-radius:2px;background:#000;font-weight:700;font-size:12px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.armed{border-color:var(--bad);color:#ffb4ab}
.seg{display:inline-flex;align-items:center;border:2px solid var(--line-2);border-radius:2px;background:#000;height:30px}
.seg span{padding:0 8px;font-size:11px;font-weight:700;color:var(--muted)}
.seg button{height:26px;padding:0 10px;border:0;border-left:1px solid var(--line);background:#000;font-weight:700;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--line-2);color:#fff}
.live{display:inline-flex;align-items:center;gap:6px;min-width:118px;padding:0 4px;font-size:12px;font-weight:700;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.live.ok i{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.live.busy i{background:var(--accent)}
.live.bad i{background:var(--bad)}

/* Layout: signups take the whole left column; groups and coverage stack on the right, so a long signup list never pushes coverage down. */
.layout{display:grid;grid-template-columns:440px minmax(0,1fr);gap:10px;align-items:start;max-width:1500px;margin:0 auto;padding:10px max(10px,env(safe-area-inset-right)) 24px max(10px,env(safe-area-inset-left))}
.plan{display:grid;gap:10px;min-width:0}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px;min-width:0}
.banner{grid-column:1 / -1;padding:10px 12px;border:1px solid var(--warn);background:#1d1709;color:#f6dca4;border-radius:3px;font-size:12.5px}

.hint{margin:4px 2px 10px;font-size:11.5px;color:var(--muted)}
.stats{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-size:12px;font-weight:700}
.stats dt{color:var(--muted);text-align:right}
.stats dd{margin:0}
.stats b{color:var(--accent);font-variant-numeric:tabular-nums}

/* Icons */
.ic{display:block;flex:none;background:var(--panel-2);border:1px solid #000;object-fit:cover}
.ic.broken{opacity:0}

/* Groups */
.groups{padding:8px 14px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 18px}
.group h3{margin:2px 0 6px;text-align:center;font-size:13px;color:#fff}
.cells{display:flex;flex-direction:column;gap:4px}
.cell{position:relative;display:flex;align-items:center;height:30px;border:2px solid var(--line-2);background:#000;cursor:pointer;transition:opacity .12s}
.cell.empty:hover{border-color:var(--accent)}
.cell.sel{border-color:#fff;box-shadow:0 0 0 1px #fff}
.cell.filled{border:1px solid #000;background:var(--c);color:var(--ci)}
.cell.filled .ic{width:28px;height:28px;border:0;border-right:1px solid #000}
.cell .nm{flex:1;min-width:0;padding:0 24px 0 6px;text-align:center;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .nm.anon{font-weight:400;font-style:italic;opacity:.65}
.cell input{flex:1;min-width:0;height:22px;margin:0 26px 0 4px;padding:0 6px;border:1px solid #000;border-radius:2px;background:rgba(255,255,255,.92);color:#000;font-weight:700;font-size:13px;text-align:center}
.cell .x{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:20px;height:20px;padding:0;border:0;border-radius:2px;background:rgba(0,0,0,.45);color:#fff;font-weight:700;font-size:12px;line-height:20px;opacity:0}
.cell:hover .x,.cell.editing .x,.cell:focus-within .x{opacity:1}
@media (hover:none){.cell .x{opacity:.9}}
.cell .pick{flex:1;min-width:0;height:24px;margin:0 3px;padding:0 4px;border:0;background:#000;color:var(--text);font-weight:700;font-size:12px;cursor:pointer}
.cell .pick option,.cell .pick optgroup{background:var(--panel);color:var(--text)}
.cell.empty .nm{padding:0 6px}
.cell.drop{outline:2px dashed #fff;outline-offset:1px}
.cell.dragging{opacity:.35}
.grid.filtering .cell.filled:not(.hl){opacity:.3}
.cell.hl{box-shadow:0 0 0 2px #fff,0 0 10px rgba(255,255,255,.6)}
.party{display:flex;flex-wrap:wrap;gap:3px;min-height:20px;margin-top:5px}
.party .ic{width:18px;height:18px}
.foot{margin:14px 2px 0;font-size:11.5px;color:var(--muted)}

/* Signups: who can come and what they can play. A separate list, not linked to the groups. */
.signups{padding:8px 10px 12px;container-type:inline-size}
.signups h2{margin:2px 0 0;font-size:14px;color:var(--accent)}
.signups h2 small{font-size:11px;color:var(--muted)}
.su.placed{opacity:.55}
.su.placed:hover,.su.placed:focus-within{opacity:1}
.su .where{font-size:11px;font-weight:700;color:var(--accent)}
.chip{cursor:grab}
.chip.on{box-shadow:0 0 0 2px #fff}
.signups.filtering .chip:not(.elig){opacity:.2}
.signups.filtering .chip.elig{opacity:1;box-shadow:0 0 0 2px #fff}
.su{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-bottom:4px;padding:3px;border:1px solid var(--line);background:#000}
.su-name{flex:0 1 150px;min-width:96px;height:26px;padding:0 6px;border:1px solid var(--line-2);border-radius:2px;background:var(--panel-2);font-weight:700;font-size:13px}
.su.new .su-name{border-style:dashed;background:#000}
.su-specs{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.chip{display:inline-flex;align-items:center;height:24px;border:1px solid #000;background:var(--c);color:var(--ci);font-family:var(--narrow);font-weight:700;font-size:12px;white-space:nowrap}
.su-specs .chip:not(:first-child){opacity:.72}
.su-specs .chip:hover{opacity:1}
.chip .ic{width:22px;height:22px;border:0;border-right:1px solid #000}
.chip button{height:22px;padding:0 3px 0 5px;border:0;background:none;color:inherit;font:inherit}
.chip button + button{padding:0 6px 0 3px;opacity:.55}
.chip button:hover{opacity:1;text-decoration:underline}
.su-add{height:24px;max-width:110px;padding:0 4px;border:1px dashed var(--line-2);border-radius:2px;background:#000;color:var(--muted);font-weight:700;font-size:12px;cursor:pointer}
.su-add:hover{border-color:var(--accent);color:var(--text)}
.su-add option,.su-add optgroup{background:var(--panel);color:var(--text)}
.su .mini{height:24px;padding:0 6px;border:0;border-radius:2px;background:none;color:var(--muted);font-weight:700;font-size:12px}
.su .mini:hover{color:#fff}
@container (max-width:520px){.su-name{flex:1}.su-specs{order:1;flex-basis:100%}}

/* Buffs */
.buffs{padding:4px 14px 12px;columns:220px;column-gap:28px}
.bsec{break-inside:avoid;padding-top:6px}
.buffs h2{margin:4px 0 3px;font-size:14px;color:var(--accent)}
.buffs h2 small{font-size:10.5px;color:var(--muted);font-weight:400;margin-left:4px}
.brow{display:flex;align-items:center;gap:6px;width:100%;padding:1px 4px;border:0;border-radius:2px;background:none;text-align:left;font-weight:700;font-size:12px;color:#fff}
.brow .ic{width:16px;height:16px;opacity:.4}
.brow b{min-width:14px;text-align:right;font-variant-numeric:tabular-nums}
.brow.on{color:var(--accent)}
.brow.on .ic{opacity:1}
.brow:hover{background:var(--panel-2)}
.brow.pin{background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--accent)}
.notes{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px;break-inside:avoid}
.notes li{padding:6px 8px;border-left:2px solid var(--warn);background:#18140b;font-size:11.5px;line-height:1.4;color:#f1dfb8}

/* Copy dialog and toast */
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.7)}
.dialog{width:min(560px,100%);padding:14px;background:var(--panel);border:2px solid var(--line-2);border-radius:3px}
.dialog h3{margin:0 0 8px;font-size:14px;color:var(--accent)}
.dialog textarea{width:100%;height:240px;padding:8px;background:#000;color:var(--text);border:1px solid var(--line-2);font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
.dialog .row{display:flex;justify-content:flex-end;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;max-width:calc(100% - 32px);padding:8px 14px;background:var(--text);color:#000;font-weight:700;font-size:12px;border-radius:3px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>Raid Comp</h1><p>World of Warcraft: Forever</p></div>
  <div class="tools" id="tools"></div>
</header>
<main class="layout">
  <div class="banner" id="banner" hidden></div>
  <section class="panel signups" id="signups" aria-label="Signups"></section>
  <div class="plan">
    <section class="panel groups" aria-label="Raid groups">
      <div class="grid" id="grid"></div>
      <p class="foot">Everyone with this link edits the same raid. Changes show up for the others within a couple of seconds.</p>
    </section>
    <section class="panel buffs" id="buffs" aria-label="Raid coverage"></section>
  </div>
</main>
<div id="dialog-root"></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
(() => {
  "use strict";

  const SPEC = {};
  SPEC_ROWS.forEach((r) => {

  // [section, party-only?, [[tag, label, icon, sources]]]

    ["Offensive debuffs", false, [

  /* ---------- Sync ---------- */

  function readJSON(r) {

  function saveSignup(row) {

  function signupAction(act, id, key) {
    const u = state.signups.find((x) => x.id === id);
    if (!u) return;
    if (act === "su-del") updateSignup(id, null);
    else if (act === "su-drop") updateSignup(id, u.n || u.c.length > 1 ? { ...u, c: u.c.filter((k) => k !== key) } : null);
    else if (act === "su-place") placePlayer(key, u.n);
  }
  function rosterText() {
    const a = analyze(), lines = ["Raid comp: " + a.players + "/" + state.size + " players (" + a.roles.tank + " tank, " + a.roles.heal + " heal, " + a.roles.melee + " melee, " + a.roles.range + " range)", ""];
    for (let g = 0; g < state.size / 5; g++) {
      const mem = state.slots.slice(g * 5, g * 5 + 5).filter(Boolean).map((m) => (m.n || "?") + " (" + specName(SPEC[m.s]) + ")");
      lines.push("Group " + (g + 1) + ": " + (mem.length ? mem.join(", ") : "empty"));
    }
    const missing = BUFFS.filter((b) => !b[1]).flatMap((b) => b[2]).filter((r) => !a.tags[r[0]]).map((r) => r[1]);
    if (missing.length) lines.push("", "Missing: " + missing.join(", "));
    return lines.join("\n");
  }
  function showCopyDialog(text) {
    dialogRoot.innerHTML = '<div class="overlay" data-act="close-dialog"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="copy-title"><h3 id="copy-title">Copy this roster</h3><textarea id="copy-text" readonly aria-label="Roster text">' + esc(text) + '</textarea><div class="row"><button type="button" class="btn" data-act="close-dialog">Done</button></div></div></div>';
    const ta = $("#copy-text"); ta.focus(); ta.select();
  }
  let toastTimer = null;
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
  }

  /* ---------- Events ---------- */
  document.addEventListener("click", (e) => {
    const t = e.target;
    if (t.closest && t.closest(".overlay") && (t.classList.contains("overlay") || t.dataset.act === "close-dialog")) { dialogRoot.innerHTML = ""; return; }
    const sizeBtn = t.closest("[data-size]");
    if (sizeBtn) { const z = +sizeBtn.dataset.size; if (z !== state.size) { sel = null; change((s) => { s.size = z; }); } return; }
    const act = t.closest("[data-act]");
    if (act) {
      const a = act.dataset.act;
      if (a.startsWith("su-")) { signupAction(a, act.closest(".su").dataset.id, act.dataset.spec); return; }
      if (a === "remove") { removeSlot(+act.closest(".cell").dataset.i); return; }
      if (a === "pets") {
        pets = !pets;
        try { localStorage.setItem(PETS_KEY, pets ? "on" : "off"); } catch (err) {}
        renderAll(); return;
      }
      if (a === "copy") {
        const text = rosterText();
        try { navigator.clipboard.writeText(text).then(() => toast("Roster copied"), () => showCopyDialog(text)); }
        catch (err) { showCopyDialog(text); }
        return;
      }
      if (a === "clear") {
        if (!clearArmed) { clearArmed = setTimeout(() => { clearArmed = 0; renderTools(); }, 4000); renderTools(); return; }
        clearTimeout(clearArmed); clearArmed = 0; sel = null; editing = null;
        change((s) => { for (let i = 0; i < MAX; i++) s.slots[i] = null; });
        return;
      }
    }
    const brow = t.closest(".brow");
    if (brow) { pinned = pinned === brow.dataset.buff ? null : brow.dataset.buff; renderBuffs(analyze()); applyFilter(); return; }
    const cell = t.closest(".cell");
    if (cell) {
      if (t.tagName === "INPUT" || t.tagName === "SELECT" || t.tagName === "OPTION") return;
      const i = +cell.dataset.i;
      if (cell.classList.contains("empty")) {
        sel = sel === i ? null : i;
        if (editing !== null) commitEdit();
        renderGrid(analyze()); applyFilter();
        const pick = grid.querySelector(".pick");
        if (pick) { pick.focus(); try { pick.showPicker(); } catch (err) { /* older browsers: the menu opens on the next click */ } }
        return;
      }
      if (editing === i) return;
      if (editing !== null) commitEdit();
      sel = i; startEdit(i);
      return;
    }
    if (sel !== null && !t.closest(".signups")) { sel = null; renderGrid(analyze()); applyFilter(); }
  });
  document.addEventListener("keydown", (e) => {
    const t = e.target;
    if (t.id === "name-input") {
      if (e.key === "Enter") { e.preventDefault(); sel = null; commitEdit(); }
      else if (e.key === "Escape") { e.preventDefault(); sel = null; commitEdit(false); }
      return;
    }
    if (t.classList && t.classList.contains("su-name")) { if (e.key === "Enter") t.blur(); return; }
    if ((e.key === "Enter" || e.key === " ") && t.classList && t.classList.contains("cell")) { e.preventDefault(); t.click(); return; }
    if (e.key === "Escape") {
      if (dialogRoot.innerHTML) { dialogRoot.innerHTML = ""; return; }
      sel = null; pinned = null; renderGrid(analyze()); renderBuffs(analyze()); applyFilter();
    }
  });
  document.addEventListener("input", (e) => { if (e.target.id === "name-input") draftName = e.target.value; });
  document.addEventListener("focusout", (e) => {
    if (e.target.id !== "name-input") return;
    // Let a click on a signup spec land first so it can fill the selected slot.
    setTimeout(() => { if (editing !== null && document.activeElement && document.activeElement.id !== "name-input") commitEdit(); }, 0);
  });

  // Picking a signup in an empty slot. While that menu is open, remote updates wait so it does not close under you.
  function picking() { const a = document.activeElement; return !!(a && a.classList && a.classList.contains("pick")); }
  grid.addEventListener("change", (e) => {
    if (!e.target.classList.contains("pick") || !e.target.value) return;
    const [id, key] = e.target.value.split("|");
    const u = state.signups.find((x) => x.id === id);
    if (u) placePlayer(key, u.n, +e.target.dataset.i);
  });
  grid.addEventListener("focusout", (e) => { if (e.target.classList.contains("pick")) setTimeout(applyDeferred, 0); });

  // Signups save on change: a name when you leave the box or press Enter, a spec as soon as you pick it.
  signups.addEventListener("change", (e) => {
    const row = e.target.closest(".su");
    if (!row) return;
    holdSignups = true; // focus may be moving to another field in this list; redraw once it lands
    saveSignup(row);
    if (e.target.tagName === "SELECT") e.target.blur();
    setTimeout(() => { holdSignups = false; if (signupsDirty) renderSignups(); }, 0);
  });
  signups.addEventListener("focusout", () => setTimeout(() => { if (signupsDirty) renderSignups(); }, 0));

  buffs.addEventListener("mouseover", (e) => { const b = e.target.closest(".brow"); const tag = b ? b.dataset.buff : null; if (tag !== hovered) { hovered = tag; applyFilter(); } });
  buffs.addEventListener("mouseleave", () => { hovered = null; applyFilter(); });

  // Drag and drop: signup specs onto slots, players between slots, players off the raid to remove them.
  document.addEventListener("dragstart", (e) => {
    const spec = e.target.closest && e.target.closest(".chip");
    const cell = e.target.closest && e.target.closest(".cell.filled");
    if (spec) drag = { type: "spec", key: spec.dataset.spec, n: (state.signups.find((u) => u.id === spec.closest(".su").dataset.id) || { n: "" }).n };
    else if (cell && editing === null) { drag = { type: "cell", i: +cell.dataset.i }; cell.classList.add("dragging"); }
    else return;
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", drag.type === "spec" ? drag.key : String(drag.i)); } catch (err) {}
  });
  document.addEventListener("dragover", (e) => {
    if (!drag) return;
    const cell = e.target.closest(".cell");
    const offRaid = drag.type === "cell" && e.target.closest(".signups, .buffs");
    if (!cell && !offRaid) return;
    e.preventDefault();
    grid.querySelectorAll(".drop").forEach((el) => { if (el !== cell) el.classList.remove("drop"); });
    if (cell) cell.classList.add("drop");
  });
  document.addEventListener("drop", (e) => {
    if (!drag) return;
    e.preventDefault();
    const d = drag;
    drag = null;
    const cell = e.target.closest(".cell");
    if (cell) {
      const to = +cell.dataset.i;
      if (d.type === "spec") placePlayer(d.key, d.n, to);
      else if (d.i !== to) change((s) => { const x = s.slots[d.i]; s.slots[d.i] = s.slots[to]; s.slots[to] = x; });
      else renderAll();
    } else if (d.type === "cell" && e.target.closest(".signups, .buffs")) removeSlot(d.i);
    applyDeferred();
  });
  document.addEventListener("dragend", () => {
    drag = null;
    grid.querySelectorAll(".drop, .dragging").forEach((el) => el.classList.remove("drop", "dragging"));
    applyDeferred();
  });

  renderAll();
  poll();
})();
</script>
</body>
</html>
